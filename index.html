<!doctype html>
<html lang="fr">
<head>

<body>
<canvas id="gl"></canvas>
<canvas id="ui"></canvas>
<div id="nogl">Ce navigateur ne prend pas en charge WebGL2.<br>Sandcaller a besoin d'un navigateur récent.</div>
<script>
'use strict';
(function(){

// ════════════════════════════════════════════════════════════════════
//  Constants
// ════════════════════════════════════════════════════════════════════
const QS = new URLSearchParams(location.search);
const TEST = QS.has('test');
const T = 1024;            // world tile size (m), seamless
const N = 2048;            // height texels per side (0.5 m)
const TX = T / N;
const DN = 512;            // displacement texels per side (2 m)
const DC = T / DN;
const FAR = 1600;
const SUN_EL = 0.19;
const SUNH = [-2 / Math.sqrt(5), 1 / Math.sqrt(5)];
const SUN = [Math.cos(SUN_EL) * SUNH[0], Math.sin(SUN_EL), Math.cos(SUN_EL) * SUNH[1]];
const WN = 32, WSP = 5.0, WR = 7.0;     // worm spheres, spacing, radius
const SEED = 1337;

const PAL = {
  SAND: ['#1d1631','#2f2346','#46305a','#63395a','#8a4450','#b2573f','#cf7438','#e3964a','#f0b968','#f7d895'],
  SKY:  ['#fbeed0','#f6dcac','#f0c08a','#e2a283','#c98a8c','#a27896','#6f5f93','#454083','#2b2862','#1b1945'],
  HAZE: ['#f6d9a6','#eeb57c','#dc9878','#be8590','#9d7593','#7f6690'],
  ROCK: ['#120c1c','#24182c','#3d2834','#5c3d3c','#7a5446'],
  WORM: ['#1c1218','#3a2a2c','#5e4538','#86654a','#b08b62','#cdb084'],
  MOUTH:['#12060c','#4a1626','#efe2c4','#b8a68a'],
  CLOAK:['#1f2a40','#34506a','#5f8496'],
  SUIT: ['#5e4c48','#9c8270','#d4bc98'],
  GOG:  ['#141018','#2a2232','#e3b25c'],
  METAL:['#262734','#565b6c','#a8adba'],
  MISC: ['#140c18','#fff4dc','#efe4d0','#d3c5bb','#ffb347'],
};
function hex3(h){ const v = parseInt(h.slice(1), 16); return [(v>>16&255)/255, (v>>8&255)/255, (v&255)/255]; }
function glslPal(){
  let s = '';
  for (const k in PAL){
    const a = PAL[k];
    s += `const vec3 ${k}[${a.length}] = vec3[${a.length}](` +
      a.map(h => { const c = hex3(h); return `vec3(${c[0].toFixed(4)},${c[1].toFixed(4)},${c[2].toFixed(4)})`; }).join(',') + ');\n';
  }
  return s;
}

const clamp = (x,a,b) => x < a ? a : x > b ? b : x;
const lerp = (a,b,t) => a + (b - a) * t;
const ss = (a,b,x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const rnd = Math.random;
const rr = (a,b) => a + (b - a) * rnd();
const damp = (k, dt) => 1 - Math.exp(-k * dt);
function angWrap(a){ while (a > Math.PI) a -= 2*Math.PI; while (a < -Math.PI) a += 2*Math.PI; return a; }

// ════════════════════════════════════════════════════════════════════
//  Dune generator (runs inside web workers; falls back to main thread)
// ════════════════════════════════════════════════════════════════════
const WSRC = `
'use strict';
const T=${T}, N=${N}, TX=${TX}, CG=512, CS=T/CG;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hash(ix,iy,s){let h=(Math.imul(ix,374761393)+Math.imul(iy,668265263)+Math.imul(s,1013904223))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return (h>>>0)/4294967296;}
function gn(x,y,px,py,s){
  const ix=Math.floor(x), iy=Math.floor(y), fx=x-ix, fy=y-iy;
  const x0=((ix%px)+px)%px, x1=(x0+1)%px, y0=((iy%py)+py)%py, y1=(y0+1)%py;
  const a00=hash(x0,y0,s)*6.2831853, a10=hash(x1,y0,s)*6.2831853, a01=hash(x0,y1,s)*6.2831853, a11=hash(x1,y1,s)*6.2831853;
  const n00=Math.cos(a00)*fx+Math.sin(a00)*fy, n10=Math.cos(a10)*(fx-1)+Math.sin(a10)*fy;
  const n01=Math.cos(a01)*fx+Math.sin(a01)*(fy-1), n11=Math.cos(a11)*(fx-1)+Math.sin(a11)*(fy-1);
  const ux=fx*fx*fx*(fx*(fx*6-15)+10), uy=fy*fy*fy*(fy*(fy*6-15)+10);
  return (n00+(n10-n00)*ux+(n01-n00)*uy+(n00-n10-n01+n11)*ux*uy)*1.45;
}
function fbm(u,v,px,py,oct,s){let a=1,sum=0,norm=0,f=1;for(let i=0;i<oct;i++){sum+=a*gn(u*px*f,v*py*f,px*f,py*f,s+i*101);norm+=a;a*=0.5;f*=2;}return sum/norm;}
function ss(a,b,x){let t=(x-a)/(b-a);t=t<0?0:t>1?1:t;return t*t*(3-2*t);}
function prof(t,c){ if(t<c){const s=t/c;return s*s*(1.5-0.5*s);} const s=(t-c)/(1-c); return Math.pow(1-s,1.25); }
function ampAt(u,v,s){ return 1.2+21*ss(-0.25,0.42,fbm(u,v,3,3,3,s+2)); }
function fields(u,v,s,out,o){
  out[0][o]=26*fbm(u,v,2,5,3,s+1);
  out[1][o]=ampAt(u,v,s);
  out[2][o]=9*fbm(u,v,3,8,2,s+3);
  out[3][o]=2.6*fbm(u,v,4,4,2,s+4);
  out[4][o]=1.0+0.7*fbm(u,v,6,6,2,s+5);
}
function tor(d){ return d - T*Math.round(d/T); }
let FEAT=null;
function features(seed){
  if (FEAT && FEAT.seed===seed) return FEAT;
  const R=mulberry(seed*7+3);
  const bar=[]; let tries=0;
  while(bar.length<90 && tries<4000){
    tries++;
    const x=R()*T, z=R()*T;
    if (ampAt(x/T,z/T,seed)>5.5) continue;
    const W=10+R()*16;
    let ok=true;
    for(const b of bar){ const dx=tor(x-b.x), dz=tor(z-b.z); if(dx*dx+dz*dz < Math.pow((W+b.W)*1.6,2)){ok=false;break;} }
    if(!ok) continue;
    const H=W*0.38, Lw=W*2.6, th=(R()-0.5)*0.3;
    bar.push({x,z,W,H,Lw,c:Math.cos(th),s:Math.sin(th),rb:Math.max(Lw+2, W*1.25+H*1.5)*1.05});
  }
  const G=32, grid=[]; for(let i=0;i<G*G;i++) grid.push([]);
  bar.forEach((b,bi)=>{
    const c0x=Math.floor((b.x-b.rb)/32), c1x=Math.floor((b.x+b.rb)/32), c0z=Math.floor((b.z-b.rb)/32), c1z=Math.floor((b.z+b.rb)/32);
    for(let cz=c0z;cz<=c1z;cz++) for(let cx=c0x;cx<=c1x;cx++) grid[(cz&31)*G+(cx&31)].push(bi);
  });
  const rocks=[]; tries=0;
  while(rocks.length<7 && tries<2000){
    tries++;
    const x=R()*T, z=R()*T; let ok=true;
    for(const r of rocks){ const dx=tor(x-r.x), dz=tor(z-r.z); if(dx*dx+dz*dz<230*230){ok=false;break;} }
    const dx0=tor(x-60), dz0=tor(z-60); if(dx0*dx0+dz0*dz0<140*140) ok=false;
    if(!ok) continue;
    rocks.push({x,z,R:9+R()*15,H:10+R()*12,k:rocks.length});
  }
  FEAT={seed,bar,grid,rocks};
  return FEAT;
}
function jobHeight(m, post){
  const seed=m.seed, y0=m.y0, y1=m.y1;
  const F=features(seed);
  const cj0=Math.floor(((y0+0.5)*TX)/CS)-1, cj1=Math.floor(((y1-0.5)*TX)/CS)+2;
  const rows=cj1-cj0+1;
  const fl=[0,1,2,3,4].map(()=>new Float32Array(rows*CG));
  for(let r=0;r<rows;r++){
    const cj=((cj0+r)%CG+CG)%CG, v=cj*CS/T;
    for(let ci=0;ci<CG;ci++) fields(ci*CS/T, v, seed, fl, r*CG+ci);
  }
  post({type:'prog', f:0.15});
  const H=new Float32Array((y1-y0)*N), RK=new Uint8Array((y1-y0)*N);
  const L1=T/7, L2=T/26;
  for(let j=y0;j<y1;j++){
    const z=(j+0.5)*TX, v=z/T, fz=z/CS, cj=Math.floor(fz), tz=fz-cj, r0=(cj-cj0)*CG, r1=r0+CG;
    for(let i=0;i<N;i++){
      const x=(i+0.5)*TX, fx=x/CS, ci=Math.floor(fx), tx=fx-ci, c0=ci&(CG-1), c1=(ci+1)&(CG-1);
      const w00=(1-tx)*(1-tz), w10=tx*(1-tz), w01=(1-tx)*tz, w11=tx*tz;
      const a=r0+c0,b=r0+c1,c=r1+c0,d=r1+c1;
      const W1=fl[0][a]*w00+fl[0][b]*w10+fl[0][c]*w01+fl[0][d]*w11;
      const A =fl[1][a]*w00+fl[1][b]*w10+fl[1][c]*w01+fl[1][d]*w11;
      const W2=fl[2][a]*w00+fl[2][b]*w10+fl[2][c]*w01+fl[2][d]*w11;
      const B =fl[3][a]*w00+fl[3][b]*w10+fl[3][c]*w01+fl[3][d]*w11;
      const A2=fl[4][a]*w00+fl[4][b]*w10+fl[4][c]*w01+fl[4][d]*w11;
      let p1=(x+W1)/L1+v; p1-=Math.floor(p1);
      let p2=(x+W2)/L2+v*3; p2-=Math.floor(p2);
      let h=B+A*prof(p1,0.76)+A2*(1-0.6*Math.min(1,A/20))*prof(p2,0.68);
      // crescent dunes
      const cell=F.grid[((Math.floor(z/32))&31)*32+((Math.floor(x/32))&31)];
      for(let k=0;k<cell.length;k++){
        const bb=F.bar[cell[k]];
        const dx=tor(x-bb.x), dz=tor(z-bb.z);
        if(dx*dx+dz*dz>bb.rb*bb.rb) continue;
        const u=dx*bb.c+dz*bb.s, vv=(-dx*bb.s+dz*bb.c)/bb.W;
        if(vv<=-1||vv>=1) continue;
        const w=1-vv*vv, uc=0.95*bb.W*vv*vv, hc=bb.H*Math.pow(w,0.6), s=u-uc;
        let hb=0;
        if(s<0){ const L=bb.Lw*Math.sqrt(w)+1; const q=1+s/L; if(q<=0) continue; hb=hc*q*q*(1.5-0.5*q); }
        else { const Ll=hc*1.45+0.3; const q=1-s/Ll; if(q<=0) continue; hb=hc*Math.pow(q,1.2); }
        if(B+hb>h) h=B+hb;
      }
      // rock outcrops
      let rk=0;
      for(let k=0;k<F.rocks.length;k++){
        const ro=F.rocks[k];
        const dx=tor(x-ro.x), dz=tor(z-ro.z), d2=dx*dx+dz*dz, lim=ro.R*1.8;
        if(d2>lim*lim) continue;
        const d=Math.sqrt(d2), au=Math.atan2(dz,dx)/6.2831853+0.5;
        const rrad=ro.R*(1+0.28*gn(au*7,ro.k*3.1,7,64,seed+50)+0.12*gn(au*19,ro.k*5.7,19,64,seed+51));
        const q=1-d/rrad;
        if(q<-0.4) continue;
        const jag=fbm(x/T,z/T,180,180,2,seed+60);
        let hr;
        if(q>0){
          const wall=ss(-0.02,0.14,q);
          hr=ro.H*(0.8+0.2*Math.min(1,q*1.6))*wall+jag*1.4*wall;
          const st=ro.H/4.5, kk=Math.floor(hr/st), f=hr/st-kk;
          hr=(kk+ss(0.5,1.0,f))*st;
          hr=Math.max(hr, ro.H*0.2*ss(-0.4,0,q));
        } else {
          hr=ro.H*0.2*ss(-0.4,0,q)+jag*0.8*ss(-0.4,0,q);
        }
        hr+=B*0.5;
        if(hr>h){ const m2=Math.min(1,(hr-h)*1.6); if(m2*255>rk) rk=Math.round(m2*255); h=hr; }
      }
      H[(j-y0)*N+i]=h; RK[(j-y0)*N+i]=rk;
    }
    if(((j-y0)&31)===31) post({type:'prog', f:0.15+0.85*(j-y0+1)/(y1-y0)});
  }
  post({type:'height', y0, y1, h:H, r:RK}, [H.buffer, RK.buffer]);
}
function jobPost(m, post){
  const h=m.h, y0=m.y0, y1=m.y1, k=m.k, W=m.W, tanE=m.tanE;
  const nrm=new Uint8Array((y1-y0)*N*2);
  for(let j=y0;j<y1;j++){
    const zm=((j-1)&(N-1))*N, zp=((j+1)&(N-1))*N, zr=j*N;
    for(let i=0;i<N;i++){
      const xm=(i-1)&(N-1), xp=(i+1)&(N-1);
      const gx=(h[zr+xp]-h[zr+xm])/(2*TX), gz=(h[zp+i]-h[zm+i])/(2*TX);
      const l=Math.sqrt(gx*gx+gz*gz+1);
      const o=((j-y0)*N+i)*2;
      nrm[o]=Math.round((-gx/l*0.5+0.5)*255); nrm[o+1]=Math.round((-gz/l*0.5+0.5)*255);
    }
  }
  post({type:'prog', f:0.5});
  // sun shadows: sweep lines along the light direction (+2,-1) texels per step
  const sh=new Uint8Array(N*N);
  const drop=tanE*Math.sqrt(5)*TX;
  for(let p=0;p<2;p++){
    for(let c=k;c<N/2;c+=W){
      let x=p, y=c, Hs=-1e9;
      for(let s=0;s<2*N;s++){
        const idx=y*N+x, hv=h[idx];
        Hs=Math.max(Hs-drop, hv);
        if(s>=N){ const v=(Hs-hv)/8*255; sh[idx]=v>255?255:Math.round(v); }
        x+=2; if(x>=N) x-=N; y-=1; if(y<0) y+=N;
      }
    }
  }
  post({type:'post', y0, y1, nrm, sh}, [nrm.buffer, sh.buffer]);
}
function handle(m, post){ if(m.cmd==='height') jobHeight(m,post); else if(m.cmd==='post') jobPost(m,post); }
if (typeof importScripts==='function'){ self.onmessage=e=>handle(e.data,(d,t)=>self.postMessage(d,t||[])); }
`;

// ════════════════════════════════════════════════════════════════════
//  GL setup
// ════════════════════════════════════════════════════════════════════
const glc = document.getElementById('gl');
const ui = document.getElementById('ui');
const uctx = ui.getContext('2d');
const gl = glc.getContext('webgl2', { antialias:false, depth:false, alpha:false, preserveDrawingBuffer: TEST, powerPreference:'high-performance' });
if (!gl){ document.getElementById('nogl').style.display = 'flex'; return; }
const EXT_FL = gl.getExtension('OES_texture_float_linear');

function compile(type, src){
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)){
    const log = gl.getShaderInfoLog(s);
    console.error(log + '\n' + src.split('\n').map((l,i)=>(i+1)+': '+l).join('\n'));
    throw new Error('shader: ' + log);
  }
  return s;
}
function program(vs, fs){
  const p = gl.createProgram();
  gl.attachShader(p, compile(gl.VERTEX_SHADER, vs)); gl.attachShader(p, compile(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error('link: ' + gl.getProgramInfoLog(p));
  p.u = {};
  const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < n; i++){ const info = gl.getActiveUniform(p, i); const nm = info.name.replace(/\[0\]$/, ''); p.u[nm] = gl.getUniformLocation(p, info.name); }
  return p;
}

const HDR = `#version 300 es
precision highp float; precision highp int; precision highp sampler2D;
${glslPal()}
const float FAR = ${FAR.toFixed(1)};
const float IT = ${(1/T).toFixed(10)};
float bayer(ivec2 p){
  const float BM[16] = float[16](0.,8.,2.,10.,12.,4.,14.,6.,3.,11.,1.,9.,15.,7.,13.,5.);
  return (BM[(p.y&3)*4+(p.x&3)]+0.5)/16.0;
}
float hash12(vec2 p){ vec3 p3 = fract(vec3(p.xyx)*.1031); p3 += dot(p3, p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
float vnoise(vec2 p){ vec2 i=floor(p), f=fract(p); f=f*f*(3.-2.*f);
  return mix(mix(hash12(i),hash12(i+vec2(1,0)),f.x), mix(hash12(i+vec2(0,1)),hash12(i+vec2(1,1)),f.x), f.y); }
`;

const VS_FULL = `#version 300 es
void main(){ vec2 p = vec2((gl_VertexID<<1)&2, gl_VertexID&2); gl_Position = vec4(p*2.-1., 0., 1.); }`;

const FS_SCENE = HDR + `
uniform vec2 uRes;
uniform vec3 uCP, uCF, uCR, uCU;
uniform float uTanH, uAsp, uPix, uTime, uWind, uTop, uMouth;
uniform vec3 uSun, uM1, uM2;
uniform sampler2D uH, uN, uD, uB;
uniform vec3 uBO;
uniform vec4 uW[${WN}];
uniform int uWN;
uniform vec4 uWB;
uniform vec4 uPl[4];
uniform vec4 uTh[2];
uniform vec4 uFP[48];
out vec4 oC;

float hS(vec2 p, float l){ return textureLod(uH, p*IT, l).r; }
float hD(vec2 p){ return textureLod(uD, p*IT, 0.).r; }
float hB(vec2 p){
  if (uBO.z < 0.5) return 0.;
  vec2 uv = (p - uBO.xy)/256.;
  if (uv.x < 0. || uv.y < 0. || uv.x > 1. || uv.y > 1.) return 0.;
  return textureLod(uB, uv, 0.).r;
}
float hT(vec2 p, float l){ return hS(p,l) + hD(p) + hB(p); }

float march(vec3 ro, vec3 rd, out bool hit){
  hit = false;
  float t = 0.02;
  if (ro.y > uTop){ if (rd.y >= -1e-4) return FAR; t = (ro.y-uTop)/(-rd.y); }
  float lt = t;
  for (int i=0;i<200;i++){
    if (t > FAR) return FAR;
    vec3 p = ro + rd*t;
    if (p.y > uTop && rd.y > 0.) return FAR;
    float lod = clamp(log2(t*uPix*2.0+1e-6), 0., 6.);
    float d = p.y - hT(p.xz, lod);
    if (d < 0.){
      float a = lt, b = t;
      for (int k=0;k<7;k++){ float m=(a+b)*.5; vec3 q=ro+rd*m; if (q.y-hT(q.xz,lod) < 0.) b=m; else a=m; }
      hit = true; return b;
    }
    lt = t;
    t += max(d*0.6, 0.015 + t*0.006);
  }
  hit = true; return min(t, FAR);
}

// ---------- SDF helpers ----------
float sdCap(vec3 p, vec3 a, vec3 b, float r){ vec3 pa=p-a, ba=b-a; float h=clamp(dot(pa,ba)/dot(ba,ba),0.,1.); return length(pa-ba*h)-r; }
float sdCylY(vec3 p, float r, float h){ vec2 d=abs(vec2(length(p.xz),p.y))-vec2(r,h); return min(max(d.x,d.y),0.)+length(max(d,0.)); }
float sdBox(vec3 p, vec3 b){ vec3 q=abs(p)-b; return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.); }

// player: uPl[0]=pos,yaw  uPl[1]=phase,stride,lean,crouch  uPl[2]=windLocal.xz,flapT,roll  uPl[3]=arms,plant,drag,visible
vec2 sdPlayer(vec3 p){
  vec3 q = p - uPl[0].xyz;
  float cy = cos(uPl[0].w), sy = sin(uPl[0].w);
  q.xz = vec2(q.x*cy - q.z*sy, q.x*sy + q.z*cy);
  float roll = uPl[2].w;
  if (roll != 0.){ q.y -= 0.55; float c=cos(roll), s=sin(roll); q.yz = vec2(q.y*c - q.z*s, q.y*s + q.z*c); q.y += 0.55; }
  float ph=uPl[1].x, st=uPl[1].y, lean=uPl[1].z, cr=uPl[1].w, ar=uPl[3].x, pa=uPl[3].y;
  float hipY = 0.88 - 0.34*cr;
  float d = 1e9, m = 0.;
  for (int i=0;i<2;i++){
    float s = i==0 ? 1. : -1.;
    float pp = ph + (i==0 ? 0. : 3.14159);
    float sw = sin(pp)*st;
    vec3 hip = vec3(0.1*s, hipY, 0.);
    vec3 foot = vec3(0.12*s + 0.07*s*cr, 0.07 + max(0., cos(pp))*0.13*st, sw*0.36 + 0.1*cr);
    vec3 knee = (hip+foot)*0.5 + vec3(0.03*s, 0.03, 0.12 + 0.2*cr);
    d = min(d, sdCap(q, hip, knee, 0.078));
    float dsh = sdCap(q, knee, foot, 0.064);
    if (dsh < d){ d = dsh; m = q.y < 0.26 ? 6. : 0.; }
  }
  vec3 chest = vec3(0., hipY + 0.47 - 0.06*cr, 0.13*lean + 0.14*cr);
  float dto = sdCap(q, vec3(0., hipY, 0.), chest, 0.17);
  if (dto < d){ d = dto; m = abs(q.y - hipY - 0.06) < 0.035 ? 6. : (abs(q.x + q.y*0.5 - chest.y*0.5 - 0.02) < 0.03 && q.z > 0.05 ? 6. : 0.); }
  for (int i=0;i<2;i++){
    float s = i==0 ? 1. : -1.;
    float pp = ph + (i==0 ? 3.14159 : 0.);
    float sw = sin(pp)*st;
    vec3 sh = chest + vec3(0.2*s, -0.03, -0.02);
    vec3 hand = sh + vec3(0.05*s, -0.48, 0.2*sw);
    hand = mix(hand, sh + vec3(0.03*s, 0.3, 0.36), ar);
    hand = mix(hand, vec3(0.05*s, hipY - 0.12, 0.42), pa);
    vec3 elb = mix(sh, hand, 0.5) + vec3(0.06*s, 0., -0.05);
    float da = sdCap(q, sh, elb, 0.06);
    if (da < d){ d = da; m = 0.; }
    da = sdCap(q, elb, hand, 0.052);
    if (da < d){ d = da; m = length(q - hand) < 0.09 ? 6. : 0.; }
  }
  vec3 hc = chest + vec3(0., 0.25, 0.04 + 0.05*lean);
  float dhd = length(q-hc) - 0.125;
  if (dhd < d){ d = dhd; m = (q.z - hc.z > 0.06 && abs(q.y - hc.y) < 0.05) ? 2. : 0.; }
  vec3 hq = q - hc - vec3(0., 0.035, -0.035);
  float dho = max(length(hq) - 0.152, hq.z - 0.05);
  dho = min(dho, sdCap(q, hc + vec3(0.,0.07,-0.08), hc + vec3(0.,-0.02,-0.25), 0.055));
  if (dho < d){ d = dho; m = 1.; }
  // cloak
  float ys = chest.y + 0.03, yh = 0.3 + 0.3*cr;
  float L = ys - yh;
  float yn = clamp((q.y - yh)/L, 0., 1.);
  float lo = 1. - yn;
  vec2 wl = uPl[2].xy;
  float ft = uPl[2].z;
  vec2 dsp = wl * pow(lo,1.3) * (0.6 + 0.35*sin(ft*9. + yn*7. + q.x*5.))
           + vec2(0., -uPl[3].z) * pow(lo,1.2)
           + vec2(0.05*sin(ft*13.+yn*9.), 0.04*sin(ft*11.+q.x*7.))*lo;
  vec3 cq = q; cq.xz -= dsp;
  float zc = chest.z*yn - 0.02;
  float rc = 0.19 + 0.13*lo;
  float shell = abs(length(cq.xz - vec2(0., zc)) - rc) - 0.024;
  shell = max(shell, cq.z - zc - 0.03);
  float hemJ = 0.05*sin(cq.x*29. + ft*7.) + 0.035*sin(cq.x*13. - ft*5.);
  shell = max(shell, max(yh + hemJ*lo - q.y, q.y - ys));
  if (shell < d){ d = shell; m = 1.; }
  return vec2(d, m);
}

// thumper: uTh[0]=base,sink  uTh[1]=lift,light,visible,-
vec2 sdThumper(vec3 p){
  vec3 q = p - uTh[0].xyz; q.y += uTh[0].w;
  float d = sdCap(q, vec3(0.,-0.6,0.), vec3(0.,1.42,0.), 0.034); float m = 3.;
  float hy = 0.88 + uTh[1].x*0.42;
  float dh = sdCylY(q - vec3(0.,hy,0.), 0.105, 0.12) - 0.012;
  if (dh < d){ d = dh; m = 4.; }
  float dc = sdCylY(q - vec3(0.,0.1,0.), 0.13, 0.035);
  if (dc < d){ d = dc; m = 4.; }
  for (int i=0;i<3;i++){
    float a = float(i)*2.0944; vec3 r = q;
    r.xz = mat2(cos(a),-sin(a),sin(a),cos(a))*r.xz;
    float df = sdBox(r - vec3(0.,0.2,0.13), vec3(0.014,0.17,0.09));
    if (df < d){ d = df; m = 3.; }
  }
  float dl = length(q - vec3(0.,1.47,0.)) - 0.045;
  if (dl < d){ d = dl; m = 5.; }
  return vec2(d, m);
}
vec2 sdProp(vec3 p, int w){ return w==0 ? sdPlayer(p) : sdThumper(p); }
float marchProp(vec3 ro, vec3 rd, vec3 c, float rad, float tmax, int w, out float mat){
  vec3 oc = ro - c; float b = dot(oc, rd); float cc = dot(oc,oc) - rad*rad; float h = b*b - cc;
  mat = 0.;
  if (h < 0.) return -1.;
  h = sqrt(h); float t0 = max(-b-h, 0.), t1 = min(-b+h, tmax);
  if (t0 >= t1) return -1.;
  float t = t0;
  for (int i=0;i<72;i++){
    vec2 r = sdProp(ro + rd*t, w);
    if (r.x < max(0.002, t*uPix*0.4)){ mat = r.y; return t; }
    t += r.x*0.7;
    if (t > t1) break;
  }
  return -1.;
}
vec3 propN(vec3 p, int w){
  const vec2 k = vec2(1.,-1.); float e = 0.004;
  return normalize(k.xyy*sdProp(p+k.xyy*e,w).x + k.yyx*sdProp(p+k.yyx*e,w).x + k.yxy*sdProp(p+k.yxy*e,w).x + k.xxx*sdProp(p+k.xxx*e,w).x);
}

float raySegDist(vec3 ro, vec3 rd, vec3 a, vec3 b){
  vec3 ba = b-a, oa = ro-a;
  float a01 = dot(rd, ba), b0 = dot(oa, rd), b1 = dot(oa, ba), c = dot(ba,ba);
  float det = c - a01*a01;
  float u = det > 1e-6 ? clamp((b1 - a01*b0)/det, 0., 1.) : 0.;
  float s = max(dot(a + ba*u - ro, rd), 0.);
  u = clamp(dot(ro + rd*s - a, ba)/c, 0., 1.);
  return length(ro + rd*s - a - ba*u);
}

float hitWorm(vec3 ro, vec3 rd, float tmax, out int idx){
  idx = -1;
  vec3 oc = ro - uWB.xyz; float b = dot(oc,rd); float c = dot(oc,oc) - uWB.w*uWB.w; float h = b*b - c;
  if (h < 0.) return -1.;
  if (-b - sqrt(h) > tmax) return -1.;
  float best = tmax;
  for (int i=0;i<${WN};i++){
    if (i >= uWN) break;
    vec4 s = uW[i];
    if (s.w <= 0.) continue;
    vec3 o2 = ro - s.xyz; float bb = dot(o2, rd); float cc = dot(o2,o2) - s.w*s.w; float hh = bb*bb - cc;
    if (hh > 0.){ float tt = -bb - sqrt(hh); if (tt > 0. && tt < best){ best = tt; idx = i; } }
  }
  return idx >= 0 ? best : -1.;
}

float objShadow(vec3 P){
  float s = 1.;
  if (uPl[3].w > 0.5){
    vec3 a = uPl[0].xyz + vec3(0.,0.15,0.), b = uPl[0].xyz + vec3(0.,1.55,0.);
    if (length(P.xz - uPl[0].xz) < 14. && raySegDist(P, uSun, a, b) < 0.2) s = 0.;
  }
  if (uTh[1].z > 0.5){
    vec3 a = uTh[0].xyz + vec3(0.,0.1-uTh[0].w,0.), b = uTh[0].xyz + vec3(0.,1.45-uTh[0].w,0.);
    if (length(P.xz - uTh[0].xz) < 10. && raySegDist(P, uSun, a, b) < 0.07) s = 0.;
  }
  if (uWN > 0 && length(P - uWB.xyz) < uWB.w + 120.){
    for (int i=0;i<${WN};i++){
      if (i >= uWN) break;
      vec4 sp = uW[i];
      if (sp.w <= 0.) continue;
      vec3 o2 = P - sp.xyz; float bb = dot(o2, uSun); float cc = dot(o2,o2) - sp.w*sp.w;
      if (bb < 0. && bb*bb - cc > 0.){ s = 0.; break; }
    }
  }
  return s;
}

float dq(float v, float b){ return floor(v + 0.5 + (b - 0.5)*0.72); }
vec3 sandCol(float idx, float b){ return SAND[clamp(int(dq(idx, b)), 0, 9)]; }

vec3 shadeTerrain(vec3 P, float t, ivec2 ip, float b0, float b1, float b2){
  vec2 uv = P.xz*IT;
  float lodN = clamp(log2(max(t*uPix*2., 1.)), 0., 8.);
  vec4 nn = textureLod(uN, uv, lodN);
  vec2 g = vec2(nn.r*2.-1., nn.g*2.-1.);
  float ny = sqrt(max(0.05, 1.-dot(g,g)));
  vec2 grad = -g/ny;
  vec2 dd = textureLod(uD, uv, 0.).rg;
  float mark = clamp(dd.g, 0., 1.);
  float bl = hB(P.xz);
  dd.r += bl;
  if (abs(dd.r) > 0.002 || mark > 0.002){
    float e = 2.0;
    float gx = hD(P.xz+vec2(e,0.)) - hD(P.xz-vec2(e,0.)) + hB(P.xz+vec2(e,0.)) - hB(P.xz-vec2(e,0.));
    float gz = hD(P.xz+vec2(0.,e)) - hD(P.xz-vec2(0.,e)) + hB(P.xz+vec2(0.,e)) - hB(P.xz-vec2(0.,e));
    grad += vec2(gx, gz)/(2.*e);
  }
  vec3 n = normalize(vec3(-grad.x, 1., -grad.y));
  float rock = nn.a;
  float shB = textureLod(uN, uv, max(lodN, 2.6)).b;
  float shAmt = mix(nn.b, shB, 0.75)*8. - max(dd.r, 0.);
  float lit = 1. - smoothstep(0.08, 0.5, shAmt);
  if (t < 400.) lit *= objShadow(P);
  float dif = max(dot(n, uSun), 0.)*lit;
  float slope = length(grad);
  float L = 0.17 + 0.09*n.y + 1.22*pow(dif, 0.78);
  float idx = L*9.0 + 0.9*mark;
  if (t < 95.){
    float fade = 1. - smoothstep(18., 60., t);
    vec2 rp = P.xz;
    float rw = rp.x*0.93 + rp.y*0.36 + 1.2*sin(rp.y*0.23 + rp.x*0.05) + 1.4*vnoise(rp*0.35);
    float fr = fract(rw/0.85);
    float rmask = fade * (1.-smoothstep(0.3, 0.55, slope)) * (1.-mark) * (1.-rock);
    idx += (fr > 0.8 ? -0.6 : (fr < 0.1 ? 0.3 : 0.)) * rmask * (0.2 + 0.8*lit);
    float sn = vnoise(vec2(P.x*0.32 - uTime*7.5*uWind, P.z*2.4 + sin(P.x*0.2)));
    idx += step(0.84, sn) * 0.9 * fade * (1.-rock) * (0.15 + 0.85*lit);
  }
  // sand streaming over the lee side of crests
  if (t < 260. && n.x > 0.25){
    float above = hS(P.xz - vec2(3.,0.), 0.) - P.y;
    if (above > 0.2 && above < 3.2){
      float vn = vnoise(vec2((P.x - uTime*7.*uWind)*0.35, P.z*7. + uTime*0.4));
      float k = (1. - above/3.2)*lit;
      if (vn > 0.7 - 0.1*uWind) idx += 1.1*k;
    }
  }
  // footprints
  if (t < 45. && length(P.xz - uPl[0].xz) < 34.){
    for (int i=0;i<48;i++){
      vec4 f = uFP[i];
      if (f.w < -100.) continue;
      vec2 q = P.xz - f.xy;
      if (dot(q,q) > 0.09) continue;
      float a = (uTime - f.w)/30.;
      float c = cos(f.z), s = sin(f.z);
      vec2 lq = vec2(q.x*c - q.y*s, q.x*s + q.y*c);
      float e = (lq.x*lq.x)/(0.085*0.085) + (lq.y*lq.y)/(0.15*0.15);
      if (e < 1. && b2 > a) idx -= 1.6*(1.-a*0.6);
      else if (e < 1.8 && lq.y > 0.03 && b2 > a + 0.25) idx += 0.6;
    }
  }
  vec3 col = SAND[clamp(int(floor(idx + 0.5 + (b0 - 0.5)*mix(0.72, 0.45, smoothstep(60., 300., t)))), 0, 9)];
  if (rock > 0.02){
    float Lr = 0.1 + 0.95*pow(dif, 0.8) + 0.06*n.y;
    float ri = Lr*4.6;
    float strata = sin(P.y*2.4 + vnoise(P.xz*0.3)*2.);
    ri += strata > 0.6 ? 0.6 : (strata < -0.7 ? -0.7 : 0.);
    ri -= step(0.75, vnoise(P.xz*1.3 + P.y))*0.8;
    vec3 rc = ROCK[clamp(int(dq(ri, b0)), 0, 4)];
    if (b1 < rock*1.25) col = rc;
  }
  return col;
}

vec3 moon(vec3 rd, vec3 md, float r, vec3 c, float b0, float b1){
  float d = dot(rd, md);
  if (d < cos(r)) return c;
  vec3 rr = normalize(cross(md, vec3(0.,1.,0.))); vec3 uu = cross(rr, md);
  vec2 q = vec2(dot(rd, rr), dot(rd, uu))/sin(r);
  float z = sqrt(max(0., 1.-dot(q,q)));
  vec3 nrm = rr*q.x + uu*q.y - md*z;
  float l = dot(nrm, uSun);
  if (l > 0.02){
    float mar = vnoise(q*2.6 + r*40.);
    return (mar > 0.6 && b1 < 0.8) ? MISC[3] : MISC[2];
  }
  if (l > -0.12 && b0 < 0.45) return MISC[3];
  return c;
}

vec3 skyCol(vec3 rd, ivec2 ip, float b0, float b1){
  float e = max(rd.y, 0.);
  float sd = dot(rd, uSun);
  float az = dot(normalize(rd.xz+vec2(1e-5)), normalize(uSun.xz))*0.5+0.5;
  float g = pow(e, 0.6);
  float idx = g*9.4 + (1.-az)*(1.-g)*2.6 + 0.35;
  idx -= 3.0*pow(max(sd,0.), 12.) + 1.6*pow(max(sd,0.), 3.)*(1.-g);
  float sr = 0.042;
  if (sd > cos(sr)) return MISC[1];
  if (sd > cos(sr*1.5) && b0 < 0.5) return SKY[0];
  vec3 c = SKY[clamp(int(floor(idx + 0.5 + (b0 - 0.5)*0.85)), 0, 9)];
  c = moon(rd, uM1, 0.052, c, b0, b1);
  c = moon(rd, uM2, 0.027, c, b0, b1);
  return c;
}

vec3 hazeCol(vec3 rd, ivec2 ip){
  float sa = dot(normalize(rd.xz+vec2(1e-5)), normalize(uSun.xz))*0.5+0.5;
  float hi = (1.-pow(sa,1.4))*5.;
  return HAZE[clamp(int(floor(hi + bayer(ip+ivec2(3,2)))), 0, 5)];
}
vec3 fog(vec3 c, float t, vec3 rd, vec3 P, ivec2 ip){
  float f = 1. - exp(-max(t-130., 0.)*0.00125);
  f *= mix(1.0, 0.7, smoothstep(5., 45., P.y));
  f = min(f*1.12, 0.96);
  return (bayer(ip+ivec2(1,3)) < f) ? hazeCol(rd, ip) : c;
}

vec3 shadeWorm(vec3 P, int wi, float b0, float b1){
  vec4 s = uW[wi];
  vec3 n = normalize(P - s.xyz);
  int ia = max(wi-1,0), ib = min(wi+1, uWN-1);
  vec3 ax = normalize(uW[ia].xyz - uW[ib].xyz + vec3(0.,1e-4,0.));
  float a = dot(P - s.xyz, ax)/s.w;
  vec2 uv = P.xz*IT;
  vec4 nn = textureLod(uN, uv, 0.);
  float hh = hT(P.xz, 0.);
  float sh = (P.y - hh < nn.b*8. - 0.3) ? 0. : 1.;
  float dif = dot(n, uSun);
  float tone = 0.6 + 3.3*clamp(dif*1.25 + 0.3, 0., 1.)*mix(0.42, 1., sh);
  if (a > 0.52) tone += 0.9; else if (a < -0.42) tone -= 1.4;
  vec3 side = normalize(cross(ax, vec3(0.,1.,0.)) + vec3(1e-4,0.,0.));
  vec3 upp = cross(side, ax);
  float ang = atan(dot(n, side), dot(n, upp));
  float rid = fract(ang*7./6.2832 + float(wi)*0.5);
  if (rid < 0.09) tone -= 0.8;
  tone += 0.55*smoothstep(0.45, 0.95, n.y)*sh;
  vec3 col = WORM[clamp(int(dq(tone, b0)), 0, 5)];
  if (wi == 0 && uMouth > 0.02){
    vec3 hd = normalize(uW[0].xyz - uW[1].xyz);
    float m = dot(n, hd);
    float rimC = cos(0.25 + 0.95*uMouth);
    if (m > rimC){
      float r2 = (m - rimC)/(1. - rimC);
      vec3 s2 = normalize(cross(hd, abs(hd.y) < 0.9 ? vec3(0.,1.,0.) : vec3(1.,0.,0.)));
      vec3 u2 = cross(s2, hd);
      float a2 = atan(dot(n,s2), dot(n,u2));
      float tooth = 1. - abs(fract(a2*30./6.2832) - 0.5)*2.;
      float tooth2 = 1. - abs(fract(a2*44./6.2832 + 0.5) - 0.5)*2.;
      col = r2 > 0.72 ? MOUTH[0] : MOUTH[1];
      if (r2 < 0.26*tooth) col = MOUTH[2];
      else if (r2 > 0.36 && r2 < 0.36 + 0.17*tooth2) col = MOUTH[3];
      else if (r2 > 0.55 && b1 < 0.5) col = MOUTH[0];
    }
  }
  float above = P.y - hh;
  if (above < 1.1 && b1 > above/1.1){
    float dd = max(dot(n, uSun), 0.)*sh;
    col = sandCol((0.2 + 1.2*pow(dd,0.78))*9.0 + 0.6, b0);
  }
  return col;
}

vec3 shadeProp(vec3 P, vec3 rd, float mat, int w){
  vec3 n = propN(P, w);
  vec2 uv = P.xz*IT;
  vec4 nn = textureLod(uN, uv, 0.);
  float hh = hT(P.xz, 0.);
  bool shd = (P.y - hh) < nn.b*8. - 0.15;
  float dif = shd ? -1. : dot(n, uSun);
  int tn = dif > 0.28 ? 2 : (dif > -0.12 ? 1 : 0);
  if (mat > 5.5) return tn == 2 ? SUIT[0] : GOG[tn];
  if (mat < 0.5) return SUIT[tn];
  if (mat < 1.5) return CLOAK[tn];
  if (mat < 2.5) return tn == 2 ? GOG[2] : GOG[tn];
  if (mat < 3.5) return METAL[tn];
  if (mat < 4.5) return METAL[max(tn-1,0)];
  return uTh[1].y > 0.5 ? MISC[4] : METAL[0];
}

void main(){
  ivec2 ip = ivec2(gl_FragCoord.xy);
  vec2 uv = (gl_FragCoord.xy/uRes)*2.-1.;
  vec3 rd = normalize(uCF + uCR*uv.x*uTanH*uAsp + uCU*uv.y*uTanH);
  vec3 ro = uCP;
  float b0 = bayer(ip), b1 = bayer(ip+ivec2(2,1)), b2 = bayer(ip+ivec2(1,2));
  bool hit;
  float t = march(ro, rd, hit);
  float tm = hit ? t : FAR;
  int wi = -1;
  float tw = uWN > 0 ? hitWorm(ro, rd, tm, wi) : -1.;
  if (tw > 0.) tm = tw;
  float pm = 0., tmat = 0.;
  float tp = uPl[3].w > 0.5 ? marchProp(ro, rd, uPl[0].xyz + vec3(0.,0.85,0.), 1.7, tm, 0, pm) : -1.;
  if (tp > 0.) tm = tp;
  float tt = uTh[1].z > 0.5 ? marchProp(ro, rd, uTh[0].xyz + vec3(0.,0.6-uTh[0].w,0.), 1.05, tm, 1, tmat) : -1.;
  vec3 col; float id = 0.; float depth = 1.;
  if (tt > 0.){
    vec3 P = ro + rd*tt; col = fog(shadeProp(P, rd, tmat, 1), tt, rd, P, ip); id = 3.; depth = tt/FAR;
  } else if (tp > 0.){
    vec3 P = ro + rd*tp; col = fog(shadeProp(P, rd, pm, 0), tp, rd, P, ip); id = 1.; depth = tp/FAR;
  } else if (tw > 0.){
    vec3 P = ro + rd*tw; col = fog(shadeWorm(P, wi, b0, b1), tw, rd, P, ip); id = 2.; depth = tw/FAR;
  } else if (hit){
    vec3 P = ro + rd*t; col = fog(shadeTerrain(P, t, ip, b0, b1, b2), t, rd, P, ip); depth = t/FAR;
  } else {
    col = rd.y < 0.0 ? hazeCol(rd, ip) : skyCol(rd, ip, b0, b1);
  }
  oC = vec4(col, id*0.25);
  gl_FragDepth = clamp(depth, 0., 1.);
}
`;

const VS_PART = `#version 300 es
precision highp float; precision highp sampler2D;
layout(location=0) in vec4 aP;
layout(location=1) in vec2 aC;
uniform mat4 uVP; uniform vec3 uCP; uniform float uPxK;
uniform sampler2D uN, uH;
flat out int vCol; out float vA;
void main(){
  vec4 c = uVP*vec4(aP.xyz, 1.);
  float d = length(aP.xyz - uCP);
  c.z = (clamp(d/${FAR.toFixed(1)}, 0., 1.)*2. - 1.)*c.w;
  gl_Position = c;
  gl_PointSize = clamp(floor(aP.w*uPxK/max(d,0.1) + 0.5), 1., 3.);
  vec2 uv = aP.xz/${T.toFixed(1)};
  float sh = textureLod(uN, uv, 0.).b*8.; float h = textureLod(uH, uv, 0.).r;
  int ci = int(aC.x + 0.5);
  if (ci < 10 && aP.y - h < sh - 0.1) ci = max(ci - 4, 1);
  vCol = ci; vA = aC.y;
}`;
const FS_PART = HDR + `
flat in int vCol; in float vA; out vec4 o;
void main(){
  if (bayer(ivec2(gl_FragCoord.xy)) >= vA) discard;
  vec3 c = vCol < 10 ? SAND[clamp(vCol,0,9)] : (vCol < 13 ? METAL[vCol-10] : CLOAK[0]);
  o = vec4(c, 0.);
}`;

const FS_POST = HDR + `
uniform sampler2D uC, uZ; uniform vec2 uRes; uniform float uTime;
out vec4 o;

function spawnP(x,y,z,vx,vy,vz,life,size,col,a,drag,grav){
  if (P.n >= PMAX) return;
  const i = P.n++;
  P.x[i]=x; P.y[i]=y; P.z[i]=z; P.vx[i]=vx; P.vy[i]=vy; P.vz[i]=vz;

function updateParticles(dt){
  let i = 0;
  while (i < P.n){
    P.life[i] -= dt;
    if (P.life[i] <= 0){
      const j = --P.n;
      if (i !== j){
        P.x[i]=P.x[j]; P.y[i]=P.y[j]; P.z[i]=P.z[j]; P.vx[i]=P.vx[j]; P.vy[i]=P.vy[j]; P.vz[i]=P.vz[j];

      }

    const k = Math.exp(-P.drag[i]*dt);
    P.vx[i] *= k; P.vz[i] *= k; P.vy[i] = P.vy[i]*k - P.grav[i]*dt;
    P.x[i] += P.vx[i]*dt; P.y[i] += P.vy[i]*dt; P.z[i] += P.vz[i]*dt;

function hS(x, z){

  const x0 = ix & 2047, x1 = (ix+1) & 2047, z0 = (iz & 2047)*2048, z1 = ((iz+1) & 2047)*2048;

  const fx = x/DC - 0.5, fz = z/DC - 0.5;
  const ix = Math.floor(fx), iz = Math.floor(fz), tx = fx - ix, tz = fz - iz;
  const x0 = ix & 511, x1 = (ix+1) & 511, z0 = (iz & 511)*512, z1 = ((iz+1) & 511)*512;
  return (furrow[z0+x0]*(1-tx) + furrow[z0+x1]*tx)*(1-tz) + (furrow[z1+x0]*(1-tx) + furrow[z1+x1]*tx)*tz;
}
function hFur(x, z){ return hDsp(x, z); }
function hBul(x, z){
  if (!blOn) return 0;

  if (fx < 0 || fz < 0 || fx >= BL - 1 || fz >= BL - 1) return 0;

}

function uploadRect(i0, j0, w, h){
  gl.bindTexture(gl.TEXTURE_2D, texD);

  const xs = [], zs = [];
  let a = ((i0 % DN) + DN) % DN, rem = Math.min(w, DN);
  while (rem > 0){ const l = Math.min(rem, DN - a); xs.push([a, l]); rem -= l; a = 0; }
  a = ((j0 % DN) + DN) % DN; rem = Math.min(h, DN);
  while (rem > 0){ const l = Math.min(rem, DN - a); zs.push([a, l]); rem -= l; a = 0; }
  for (const [zx, zl] of zs) for (const [xx, xl] of xs){
    let o = 0;
    for (let j = zx; j < zx+zl; j++) for (let i = xx; i < xx+xl; i++){
      const k = j*DN + i; upTmp[o++] = furrow[k]; upTmp[o++] = mark[k];

function findCrest(cx, cz, R){
  let best = null, bh = -1e9;
  for (let x = -R; x <= R; x += 3) for (let z = -R; z <= R; z += 3){
    const px = cx + x, pz = cz + z;
    if (rockAt(px, pz) > 0.05) continue;
    const h = hS(px, pz);
    const lee = h - hS(px + 2.5, pz), ww = h - hS(px - 2.5, pz);
    if (lee > 1.3 && ww > 0.05 && h > bh){ bh = h; best = [px, pz]; }
  }
  if (!best) return [cx, cz];
  // climb to the local maximum
  for (let it = 0; it < 40; it++){
    let bx = best[0], bz = best[1], hb = hS(bx, bz);
    for (const [dx, dz] of [[0.5,0],[-0.5,0],[0,0.5],[0,-0.5]]){ const h = hS(best[0]+dx, best[1]+dz); if (h > hb){ hb = h; bx = best[0]+dx; bz = best[1]+dz; } }
    if (bx === best[0] && bz === best[1]) break;
    best = [bx, bz];
  }
  return [best[0] - 0.6, best[1]];
}

const AU = { ctx:null, on:false };
function auInit(){
  const C = new (window.AudioContext || window.webkitAudioContext)();

  const comp = C.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
  master.connect(comp); comp.connect(C.destination);
  const len = C.sampleRate*2;
  const white = C.createBuffer(1, len, C.sampleRate), brown = C.createBuffer(1, len, C.sampleRate);
  const wd = white.getChannelData(0), bd = brown.getChannelData(0);
  let last = 0;
  for (let i = 0; i < len; i++){ const w = Math.random()*2 - 1; wd[i] = w; last = (last + 0.02*w)/1.02; bd[i] = last*3.5; }
  const loop = buf => { const s = C.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random()*1.5); return s; };
  const chain = (src, nodes) => { let n = src; for (const x of nodes){ n.connect(x); n = x; } return n; };
  const bq = (type, f, q) => { const b = C.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 0.7; return b; };
  const gn = v => { const g = C.createGain(); g.gain.value = v; return g; };
  const windF = bq('bandpass', 420, 0.5), windG = gn(0);
  chain(loop(white), [windF, windG, master]);
  const windHF = bq('highpass', 2800, 0.5), windHG = gn(0);
  chain(loop(white), [windHF, windHG, master]);
  const rumF = bq('lowpass', 110, 0.8), rumG = gn(0);
  chain(loop(brown), [rumF, rumG, master]);
  const sub = C.createOscillator(); sub.type = 'triangle'; sub.frequency.value = 33; const subG = gn(0);

function auUpdate(){

const keys = {};
const codeAct = {};
const KEYMAP = { z:'f', w:'f', arrowup:'f', s:'b', arrowdown:'b', q:'l', a:'l', arrowleft:'l', d:'r', arrowright:'r',
  shift:'run', e:'act', ' ':'jump', tab:'view', m:'sound' };
const CODEMAP = { KeyW:'f', KeyS:'b', KeyA:'l', KeyD:'r', ShiftLeft:'run', ShiftRight:'run', Space:'jump', KeyE:'act', Tab:'view' };
const touch = { on:false, jid:null, jx:0, jy:0, kx:0, ky:0, cid:null, cx:0, cy:0, btn:{} };
let isTouch = false;

function startGame(){
  if (state !== 'title') return;
  state = 'play'; titleBlend = 1;
}
window.addEventListener('keydown', e => {
  const k = (e.key || '').toLowerCase();
  let act = KEYMAP[k] || CODEMAP[e.code];
  if (act){ e.preventDefault(); if (!e.repeat && !keys[act]) onPress(act); keys[act] = true; codeAct[e.code] = act; }
  if (state === 'title' && act !== 'sound') startGame();
});
window.addEventListener('keyup', e => { const a = codeAct[e.code]; if (a){ keys[a] = false; delete codeAct[e.code]; } });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function onPress(act){
  if (act === 'sound'){ auToggle(); return; }
  if (state !== 'play') return;
  if (act === 'view'){ cam.mode = cam.mode ? 0 : 1; return; }
  if (act === 'act') doAction();
  if (act === 'jump') doJump();
}

let dragging = false, lastMX = 0, lastMY = 0;
const uiRects = {};
function inRect(r, x, y){ return r && x >= r[0] && y >= r[1] && x <= r[0] + r[2] && y <= r[1] + r[3]; }
window.addEventListener('pointerdown', e => {
  const x = e.clientX*dpr, y = e.clientY*dpr;
  if (e.pointerType === 'touch'){ isTouch = true; }
  if (inRect(uiRects.sound, x, y)){ auToggle(); return; }
  if (state === 'title'){ startGame(); if (e.pointerType !== 'touch') return; }
  if (state !== 'play') return;
  if (e.pointerType === 'touch'){
    for (const b of ['act','jump','view']){
      if (inRect(uiRects[b], x, y)){ touch.btn[e.pointerId] = b; onPress(b); keys[b] = true; return; }
    }
    if (x < ui.width*0.45 && touch.jid === null){ touch.jid = e.pointerId; touch.jx = x; touch.jy = y; touch.kx = 0; touch.ky = 0; return; }
    if (touch.cid === null){ touch.cid = e.pointerId; touch.cx = x; touch.cy = y; }
    return;
  }
  dragging = true; lastMX = e.clientX; lastMY = e.clientY;
  if (!TEST && document.pointerLockElement !== glc && glc.requestPointerLock){ try { const r = glc.requestPointerLock(); if (r && r.catch) r.catch(()=>{}); } catch(_){} }
});
window.addEventListener('pointermove', e => {
  if (e.pointerType === 'touch'){
    const x = e.clientX*dpr, y = e.clientY*dpr;
    if (e.pointerId === touch.jid){
      const R = 60*dpr; let dx = (x - touch.jx)/R, dy = (y - touch.jy)/R; const l = Math.hypot(dx, dy);
      if (l > 1){ dx /= l; dy /= l; } touch.kx = dx; touch.ky = dy;
    } else if (e.pointerId === touch.cid){
      rotateCam((x - touch.cx)/dpr*2.2, (y - touch.cy)/dpr*2.2); touch.cx = x; touch.cy = y;
    }
    return;
  }
  if (document.pointerLockElement === glc) rotateCam(e.movementX, e.movementY);
  else if (dragging){ rotateCam(e.clientX - lastMX, e.clientY - lastMY); lastMX = e.clientX; lastMY = e.clientY; }
});
function endPointer(e){
  if (e.pointerType === 'touch'){
    if (e.pointerId === touch.jid){ touch.jid = null; touch.kx = touch.ky = 0; }
    if (e.pointerId === touch.cid) touch.cid = null;
    const b = touch.btn[e.pointerId]; if (b){ keys[b] = false; delete touch.btn[e.pointerId]; }
    return;
  }
  dragging = false;
}
window.addEventListener('pointerup', endPointer);
window.addEventListener('pointercancel', endPointer);
window.addEventListener('contextmenu', e => e.preventDefault());
function rotateCam(dx, dy){
  if (state !== 'play') return;
  cam.yaw -= dx*0.0026; cam.pitch = clamp(cam.pitch - dy*0.002, -1.0, 0.35);
  cam.lastMouse = rtime;
}

// ════════════════════════════════════════════════════════════════════
//  Actions
// ════════════════════════════════════════════════════════════════════
function doAction(){
  if (hookTarget >= 0 && worm && canHook()){ throwHooks(); return; }
  if (pl.state === 'ground') { pl.state = 'plant'; pl.timer = 0; pl.vx *= 0.2; pl.vz *= 0.2; pl.svx *= 0.2; pl.svz *= 0.2; }
}
function doJump(){
  if (pl.state === 'ride'){ dismount(); return; }
  if (pl.state === 'ground'){ pl.vy = 5.6; pl.state = 'air'; pl.svx *= 0.5; pl.svz *= 0.5; sfx.puff(0.5); kick(5, 0.6); }
}

function plantThumper(){
  const fx = Math.sin(pl.yaw), fz = Math.cos(pl.yaw);
  const x = pl.x + fx*0.75, z = pl.z + fz*0.75;
  th = { x, z, y: hS(x, z), t: 0, drive: 0, active: false, life: 62, wormAt: rr(15, 30), called: false, lift: 0, beat: 0, light: 0, gone: false, mode: thumperMode(x, z) };
  sfx.plant();
  for (let i = 0; i < 18; i++){ const a = rnd()*6.283; spawnP(x, th.y + 0.05, z, Math.cos(a)*rr(0.6,1.8), rr(0.4,1.6), Math.sin(a)*rr(0.6,1.8), rr(0.4,0.8), rr(0.08,0.16), 7 + (rnd()*2|0), 0.8, 2.5, 4); }
  if (worm && worm.state === 'approach') retargetWorm();
  showMsg(th.mode === 'h' ? 'Sommet de dune : le ver viendra en surface.' : 'Creux des dunes : le ver surgira par en dessous.', 3.5);
}

function knockback(fromX, fromZ){
  if (pl.knockCd > 0) return;
  let dx = pl.x - fromX, dz = pl.z - fromZ; const l = Math.hypot(dx, dz) || 1; dx /= l; dz /= l;
  pl.vx = dx*9.5; pl.vz = dz*9.5; pl.vy = 8.5; pl.svx = pl.svz = 0;
  pl.state = 'tumble'; pl.timer = 0; pl.knockCd = 2.5;
  cam.shake = Math.max(cam.shake, 1.2);
  sfx.blast();
  for (let i = 0; i < 260; i++){
    const a = rnd()*6.283, r = rnd()*3;
    spawnP(pl.x + Math.cos(a)*r - dx*2, pl.y + rnd()*1.5, pl.z + Math.sin(a)*r - dz*2,
      dx*rr(4,14) + Math.cos(a)*rr(0,3), rr(3,13), dz*rr(4,14) + Math.sin(a)*rr(0,3), rr(0.8,2.2), rr(0.08,0.35), 5 + (rnd()*5|0), 0.9, 0.9, 9);
  }
  showMsg('Le sable vous a rejeté. Plantez un nouveau marteleur.', 4);
}

function dismount(){
  if (!worm) return;
  const h = worm.heading, fx = Math.sin(h), fz = Math.cos(h);
  let side = (keys.l ? 1 : 0) - (keys.r ? 1 : 0) + (-touch.kx);
  side = side >= 0 ? 1 : -1;
  const rx = -Math.cos(h)*side, rz = Math.sin(h)*side;   // camera-right style vector
  pl.vx = rx*7 + fx*worm.speed*0.35; pl.vz = rz*7 + fz*worm.speed*0.35; pl.vy = 6.5;
  pl.state = 'tumble'; pl.timer = 0; pl.knockCd = 1;
  worm.state = 'dive'; worm.dt = 0;
  sfx.whoosh();
  cam.shake = Math.max(cam.shake, 0.6);
}

// ════════════════════════════════════════════════════════════════════
//  Player
// ════════════════════════════════════════════════════════════════════
function kick(n, s){
  const fx = Math.sin(pl.yaw), fz = Math.cos(pl.yaw);
  for (let i = 0; i < n; i++){
    spawnP(pl.x - fx*0.2 + rr(-0.15,0.15), pl.y + 0.05, pl.z - fz*0.2 + rr(-0.15,0.15),
      -fx*rr(0.5,2.2)*s + rr(-0.6,0.6) + wind*0.8, rr(0.8,2.4)*s, -fz*rr(0.5,2.2)*s + rr(-0.6,0.6),
      rr(0.35,0.8), rr(0.05,0.12), 6 + (rnd()*3|0), 0.85, 1.5, 7);
  }
}
function stepEvent(run){
  pl.foot ^= 1;
  pl.stepF = rnd() < 0.13 ? rr(1.4, 1.75) : rr(0.72, 1.28);
  const side = pl.foot ? 1 : -1;
  const rx = -Math.cos(pl.yaw), rz = Math.sin(pl.yaw);
  const o = fpI*4;
  fp[o] = pl.x + rx*0.13*side; fp[o+1] = pl.z + rz*0.13*side; fp[o+2] = pl.yaw; fp[o+3] = time;
  fpI = (fpI + 1) % 48;
  kick(run ? 7 : 4, run ? 1.2 : 0.8);
  sfx.step(run ? 1 : 0.7);
}

function updatePlayer(dt){
  pl.knockCd = Math.max(0, pl.knockCd - dt);
  pl.flap += dt;
  if (pl.state === 'ride'){ rideFollow(dt); return; }
  if (pl.state === 'hooking'){ pl.stride = 0; pl.roll = 0; pl.plant = 0; updateHook(dt); return; }
  if (pl.state === 'swallowed'){
    pl.timer += dt;
    pl.x = pl.swx; pl.z = pl.swz; pl.y = hAt(pl.x, pl.z);
    if (pl.timer > 2.6){
      // spat back out onto the sand
      const a = rnd()*6.283;
      pl.y += 2; pl.vx = Math.cos(a)*9; pl.vz = Math.sin(a)*9; pl.vy = 11;
      pl.state = 'tumble'; pl.timer = 0; pl.knockCd = 2;
      cam.shake = Math.max(cam.shake, 0.9);
      sfx.blast();
      for (let i = 0; i < 300; i++){ const b = rnd()*6.283; spawnP(pl.x, pl.y, pl.z, Math.cos(b)*rr(1,8), rr(4,16), Math.sin(b)*rr(1,8), rr(0.8,2), rr(0.1,0.45), 5 + (rnd()*5|0), 0.9, 0.8, 9); }
      showMsg('Le ver vous a recraché. Plantez un nouveau marteleur.', 4);
    }
    return;
  }
  // input
  let ix = 0, iz = 0, run = !!keys.run;
  if (state === 'play'){
    ix = (keys.r ? 1 : 0) - (keys.l ? 1 : 0) + touch.kx;
    iz = (keys.f ? 1 : 0) - (keys.b ? 1 : 0) - touch.ky;
    if (Math.hypot(touch.kx, touch.ky) > 0.88) run = true;
  }
  const il = Math.min(1, Math.hypot(ix, iz));
  let dx = 0, dz = 0;
  if (il > 0.05){
    const fx = Math.sin(cam.yaw), fz = Math.cos(cam.yaw), rx = -Math.cos(cam.yaw), rz = Math.sin(cam.yaw);
    dx = rx*ix + fx*iz; dz = rz*ix + fz*iz; const l = Math.hypot(dx, dz); dx /= l; dz /= l;
  }
  const g = gradAt(pl.x, pl.z);
  const slope = Math.hypot(g[0], g[1]);
  const air = pl.state === 'air' || pl.state === 'tumble';
  let control = (pl.state === 'plant' || pl.state === 'roll' || pl.state === 'tumble') ? 0 : 1;
  let spd = (run ? 6.3 : 3.0)*il;
  if (!air && il > 0.05){
    const up = dx*g[0] + dz*g[1];
    spd *= up > 0 ? 1/(1 + up*3.4) : 1 + Math.min(-up, 0.5)*0.35;
  }
  const k = air ? 1.0 : (control ? 6.0 : (pl.state === 'roll' ? 2.5 : 4));
  const a = damp(k, dt);
  pl.vx += (dx*spd*control - pl.vx)*a; pl.vz += (dz*spd*control - pl.vz)*a;
  // slip-face sliding
  pl.sliding = false;
  if (!air && slope > 0.58 && rockAt(pl.x, pl.z) < 0.5){
    const moving = il > 0.05 && (dx*g[0] + dz*g[1]) < 0.1;
    const acc = 14*(slope - 0.5)*(moving ? 1 : (slope > 0.72 ? 0.6 : 0.12));
    pl.svx -= g[0]/slope*acc*dt; pl.svz -= g[1]/slope*acc*dt;
    const kk = Math.exp(-1.3*dt); pl.svx *= kk; pl.svz *= kk;
    pl.sliding = Math.hypot(pl.svx, pl.svz) > 0.6;
  } else if (!air){
    const kk = Math.exp(-5*dt); pl.svx *= kk; pl.svz *= kk;
  } else if (!air && rockAt(pl.x, pl.z) >= 0.5 && slope > 0.58){
    pl.svx -= g[0]/slope*4*dt; pl.svz -= g[1]/slope*4*dt;
  }
  if (pl.sliding){
    pl.slideFx -= dt;
    if (pl.slideFx <= 0){
      pl.slideFx = 0.06;
      for (let i = 0; i < 4; i++) spawnP(pl.x + rr(-0.3,0.3), pl.y + 0.1, pl.z + rr(-0.3,0.3), pl.svx*0.3 + rr(-0.8,0.8) + wind, rr(0.5,2), pl.svz*0.3 + rr(-0.8,0.8), rr(0.5,1.1), rr(0.08,0.2), 6 + (rnd()*4|0), 0.75, 1.2, 3);
      if (rnd() < 0.25) sfx.puff(0.35);
    }
  }
  pl.x += (pl.vx + pl.svx)*dt; pl.z += (pl.vz + pl.svz)*dt;
  const gh = hAt(pl.x, pl.z);
  if (air){
    pl.vy -= 16*dt; pl.y += pl.vy*dt;
    if (pl.state === 'tumble'){ pl.roll -= 9*dt; pl.timer += dt; }
    if (pl.y <= gh){
      pl.y = gh;
      const hard = pl.vy < -5;
      if (pl.state === 'tumble'){ pl.state = 'roll'; pl.timer = 0; }
      else pl.state = 'ground';
      pl.vy = 0;
      const n = hard ? 22 : 9;
      for (let i = 0; i < n; i++){ const an = rnd()*6.283; spawnP(pl.x, gh + 0.05, pl.z, Math.cos(an)*rr(1,3), rr(0.5,2.4), Math.sin(an)*rr(1,3), rr(0.4,0.9), rr(0.07,0.18), 6 + (rnd()*3|0), 0.85, 2, 5); }
      sfx.puff(hard ? 1 : 0.5);
    }
  } else {
    pl.y = gh; pl.vy = 0;
  }
  if (pl.y < gh - 0.01) pl.y = gh;
  // states
  if (pl.state === 'plant'){
    pl.timer += dt;
    pl.plant = ss(0, 0.25, pl.timer)*(1 - ss(0.7, 0.9, pl.timer));
    pl.crouch = 0.55*pl.plant;
    if (pl.timer >= 0.42 && !pl.planted){ pl.planted = true; plantThumper(); }
    if (pl.timer >= 0.9){ pl.state = 'ground'; pl.planted = false; }
  } else pl.plant = Math.max(0, pl.plant - dt*4);
  if (pl.state === 'roll'){
    pl.timer += dt;
    const r = Math.ceil(-pl.roll/6.2832 - 0.05)*6.2832;
    pl.roll = lerp(pl.roll, -r, damp(7, dt));
    if (pl.timer > 0.7){ pl.state = 'ground'; pl.roll = 0; }
    if (rnd() < 0.3) kick(2, 0.6);
  } else if (pl.state !== 'tumble') pl.roll = 0;
  // facing & animation
  const hs = Math.hypot(pl.vx, pl.vz);
  if (hs > 0.35 && pl.state !== 'tumble'){
    const ty = Math.atan2(pl.vx, pl.vz);
    pl.yaw += angWrap(ty - pl.yaw)*damp(9, dt);
  }
  const onFoot = pl.state === 'ground';
  pl.stride = lerp(pl.stride, onFoot && hs > 0.3 ? clamp(hs/3, 0, 1.35) : 0, damp(8, dt));
  if (onFoot && hs > 0.3){
    const sl = run ? 1.25 : 0.78;
    pl.stepT += dt*hs/(sl*pl.stepF);
    if (pl.stepT >= 1){ pl.stepT -= 1; stepEvent(run && hs > 4); }
  }
  pl.phase = Math.PI*(pl.foot + Math.min(pl.stepT, 1));
  pl.lean = lerp(pl.lean, clamp(hs/7, 0, 1), damp(5, dt));
  const wantCrouch = pl.state === 'plant' ? pl.crouch : (pl.sliding ? 0.5 : (pl.state === 'roll' ? 0.7 : (pl.state === 'tumble' ? 0.6 : 0)));
  pl.crouch = lerp(pl.crouch, wantCrouch, damp(10, dt));
  pl.arms = lerp(pl.arms, pl.state === 'tumble' ? 0.8 : (pl.sliding ? 0.35 : 0), damp(8, dt));
  pl.drag = lerp(pl.drag, clamp(hs/6.5, 0, 1)*0.35, damp(4, dt));
}
function wormBack(){
  if (!worm) return [pl.x, pl.y, pl.z];
  const s = worm.sph, i = 3*4;
  const x = s[i], y = s[i+1], z = s[i+2], r = s[i+3];
  return [x, Math.max(y + r*0.93, hAt(x, z) + 0.1), z];
}
function rideFollow(dt){
  if (!worm || worm.state !== 'ride'){ pl.state = 'air'; return; }
  const b = wormBack();
  pl.x = b[0]; pl.y = b[1]; pl.z = b[2];
  pl.vx = worm.dirx*worm.speed; pl.vz = worm.dirz*worm.speed; pl.vy = 0;
  pl.yaw += angWrap(worm.heading - pl.yaw)*damp(6, dt);
  pl.crouch = lerp(pl.crouch, 0.45, damp(5, dt));
  pl.stride = lerp(pl.stride, 0, damp(5, dt)); pl.arms = lerp(pl.arms, 0.15, damp(5, dt));
  pl.lean = lerp(pl.lean, 0.6, damp(3, dt)); pl.drag = 0.45; pl.roll = 0; pl.plant = 0;
}

// ════════════════════════════════════════════════════════════════════
//  Thumper
// ════════════════════════════════════════════════════════════════════
function updateThumper(dt){
  if (!th) return;
  th.t += dt;
  th.drive = Math.min(1, th.drive + dt*2.2);
  if (!th.active && th.drive >= 1 && th.t < th.life && !th.called2 && !th.stopped){ th.active = true; th.called2 = true; }
  if (th.active){
    const per = 1.15;
    const ph = ((th.t - 0.6) % per + per) % per / per;
    const prev = th.beat;
    th.beat = ph;
    th.lift = ph < 0.82 ? ss(0.05, 0.8, ph) : 1 - ss(0.82, 0.9, ph);
    th.light = ph < 0.2 ? 1 : 0;
    if (prev < 0.88 && ph >= 0.88){
      // strike
      for (let i = 0; i < 40; i++){
        const a = i/40*6.283 + rnd()*0.1;
        spawnP(th.x + Math.cos(a)*0.25, th.y + 0.06, th.z + Math.sin(a)*0.25, Math.cos(a)*rr(2.8,4.2), rr(0.3,1.0), Math.sin(a)*rr(2.8,4.2), rr(0.5,0.9), rr(0.07,0.14), 7 + (rnd()*3|0), 0.85, 2.6, 2);
      }
      const dv = distVol(th.x, th.z, 400);
      sfx.thump(Math.max(0.2, dv));
      const d = Math.hypot(pl.x - th.x, pl.z - th.z);
      if (d < 30) cam.shake = Math.max(cam.shake, 0.18*(1 - d/30));
    }
    if (th.t > th.life){ th.active = false; th.stopped = true; showMsg('Le marteleur s’est tu.', 2.5); }
    if (!th.called && th.t > th.wormAt && !worm){ th.called = true; spawnWorm(); }
  } else {
    th.lift = lerp(th.lift, 0, damp(4, dt)); th.light = 0;
  }
}

// ════════════════════════════════════════════════════════════════════
//  Worm
// ════════════════════════════════════════════════════════════════════
function wormRadius(i){
  if (i === 0) return 6.4;
  const t = Math.max(0, (i - 20)/(WN - 1 - 20));
  return WR*(1 - 0.7*t*t)*(i % 2 ? 0.95 : 1);
}
// Relief around a point decides how the worm comes: on a big dune it surfaces and
// arrives horizontally (mountable); low down it strikes vertically from below.
function thumperMode(x, z){
  const h0 = hS(x, z); let mn = h0, mx = h0;
  for (const r of [8, 16, 26, 38, 50]) for (let k = 0; k < 12; k++){
    const a = k/12*6.283, h = hS(x + Math.cos(a)*r, z + Math.sin(a)*r);
    if (h < mn) mn = h; if (h > mx) mx = h;
  }
  return (h0 - mn > 5 && mx - mn > 7) ? 'h' : 'v';
}
function buildPath(w, sx, sz, dirx, dirz, ex, ez, curve){
  const L0 = Math.hypot(ex - sx, ez - sz);
  const px = -dirz, pz = dirx;
  const c1x = sx + dirx*L0*0.45 + px*curve, c1z = sz + dirz*L0*0.45 + pz*curve;

// ---------- sand deformation ----------
function stampCrater(x, z, R, depth){
  const i0 = Math.floor((x - R)/DC), i1 = Math.floor((x + R)/DC), j0 = Math.floor((z - R)/DC), j1 = Math.floor((z + R)/DC);
  for (let j = j0; j <= j1; j++){
    const jj = j & 511;
    for (let i = i0; i <= i1; i++){
      const d = Math.hypot((i + 0.5)*DC - x, (j + 0.5)*DC - z)/R;
      if (d >= 1) continue;
      const idx = jj*512 + (i & 511);
      const v = -depth*(1 - d*d);
      if (v < furrow[idx]) furrow[idx] = v;
      mark[idx] = Math.max(mark[idx], 1 - d);
    }
    markRow(jj);
  }
  uploadRect(i0, j0, i1 - i0 + 1, j1 - j0 + 1);
}
function markRow(j){ if (!rowAny[j]){ rowAny[j] = 1; rowLast[j] = time; } }
function stampFurrow(w){
  const S = w.sph;
  let r0 = null;
  const under = w.state === 'approach' && headUnder(w);
  for (let k = 0; k < 10; k++){
    const x = S[k*4], y = S[k*4+1], z = S[k*4+2], r = S[k*4+3];
    const D = hS(x, z) - (y + r);
    if (D > (under ? 7 : 3)) continue;
    const str = under ? clamp(1 - D/7, 0, 1) : clamp(1 - D/3, 0, 1);
    const depth = under ? 0.9*clamp(1 - D/3.5, 0, 1) : 1.4*str;
    const R = r*1.25;
    const i0 = Math.floor((x - R)/DC), i1 = Math.floor((x + R)/DC), j0 = Math.floor((z - R)/DC), j1 = Math.floor((z + R)/DC);
    for (let j = j0; j <= j1; j++){
      const jj = j & 511;
      for (let i = i0; i <= i1; i++){
        const f = bump(Math.hypot((i + 0.5)*DC - x, (j + 0.5)*DC - z)/R);
        if (f <= 0) continue;
        const idx = jj*512 + (i & 511);
        const v = -depth*f;
        if (v < furrow[idx]) furrow[idx] = v;
        if (str*f > mark[idx]) mark[idx] = Math.min(1, str*f);
      }
      markRow(jj);
    }
    if (!r0) r0 = [i0, j0, i1, j1];
    else { r0[0] = Math.min(r0[0], i0); r0[1] = Math.min(r0[1], j0); r0[2] = Math.max(r0[2], i1); r0[3] = Math.max(r0[3], j1); }
  }
  if (r0 && r0[2] - r0[0] < 200 && r0[3] - r0[1] < 200) uploadRect(r0[0], r0[1], r0[2] - r0[0] + 1, r0[3] - r0[1] + 1);
}
// The moving bulge lives in a small worm-centred texture rebuilt every frame (cheap).
function computeBulge(){
  const w = worm;
  if (!w){ if (blOn){ blOn = false; bulgeL.fill(0); } return; }
  bulgeL.fill(0); blStamp++;
  blOx = Math.floor((w.cx - BL*DC/2)/DC)*DC; blOz = Math.floor((w.cz - BL*DC/2)/DC)*DC;
  const S = w.sph;
  const src = [];
  for (let k = 0; k < WN; k++){
    const x = S[k*4], y = S[k*4+1], z = S[k*4+2], r = S[k*4+3];
    if (hS(x, z) - (y + r) > 10) continue;
    src.push([x, y, z, r, 0]);
  }
  if ((w.state === 'approach' || w.state === 'ride' || w.state === 'bite') && src.length){
    const r = S[3];
    src.push([S[0] + w.dirx*r*0.9, S[1] + (w.state === 'approach' && headUnder(w) ? 0 : -3), S[2] + w.dirz*r*0.9, r*0.8, 1]);
  }
  for (const s of src){
    const reach = s[3]*(s[4] ? 1.6 : 2.3);
    const i0 = Math.max(1, Math.floor((s[0] - reach - blOx)/DC)), i1 = Math.min(BL - 2, Math.floor((s[0] + reach - blOx)/DC));
    const j0 = Math.max(1, Math.floor((s[2] - reach - blOz)/DC)), j1 = Math.min(BL - 2, Math.floor((s[2] + reach - blOz)/DC));
    for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++){
      const cx = blOx + (i + 0.5)*DC, cz = blOz + (j + 0.5)*DC;
      const dx = cx - s[0], dz = cz - s[2], d2 = dx*dx + dz*dz;
      if (d2 > reach*reach) continue;
      const idx = j*BL + i;
      if (blMark[idx] !== blStamp){ blMark[idx] = blStamp; blHs[idx] = hS(cx, cz) + hFur(cx, cz); }
      const d = Math.sqrt(d2), D = blHs[idx] - (s[1] + s[3]);
      let b;
      if (s[4]) b = 1.3*bump(d/(s[3]*1.6))*clamp(1 - D/6, 0, 1);
      else if (D > 0) b = 3.0*Math.exp(-D/4.0)*bump(d/(s[3]*2.1));

  }
  if (w.state === 'approach' && headUnder(w)){
    for (const c of w.cross){
      const ds = c.s - w.s;
      if (ds <= 0 || ds >= 95) continue;

      const i0 = Math.max(1, Math.floor((c.x - 14 - blOx)/DC)), i1 = Math.min(BL - 2, Math.floor((c.x + 14 - blOx)/DC));
      const j0 = Math.max(1, Math.floor((c.z - 14 - blOz)/DC)), j1 = Math.min(BL - 2, Math.floor((c.z + 14 - blOz)/DC));
      for (let j = j0; j <= j1; j++) for (let i = i0; i <= i1; i++){
        const cx = blOx + (i + 0.5)*DC, cz = blOz + (j + 0.5)*DC, d = Math.hypot(cx - c.x, cz - c.z);
        if (d < 14) bulgeL[j*BL + i] += amp*Math.sin(time*38 + cx*1.3 + cz*0.7)*bump(d/14);

  gl.bindTexture(gl.TEXTURE_2D, texB);

// Old furrows fade a few rows at a time, so there is never a big upload.
function decayFurrow(){

    for (let i = j*DN, e = i + DN; i < e; i++){
