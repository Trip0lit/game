// ════════════════════════════════════════════════════════════════════
//  Wind-blown sand veils
// ════════════════════════════════════════════════════════════════════
function updateEmitters(dt){
  const cx = pl.x, cz = pl.z;
  for (let i = emitters.length - 1; i >= 0; i--){
    const e = emitters[i];
    if (Math.hypot(e.x - cx, e.z - cz) > 170 || rnd() < dt*0.05) emitters.splice(i, 1);
  }
  const fx = Math.sin(cam.yaw), fz = Math.cos(cam.yaw);
  for (let tries = 0; tries < 6 && emitters.length < 46; tries++){
    const r = rr(6, 150), a = rr(-1.3, 1.3) + Math.atan2(fx, fz);
    const x = cx + Math.sin(a)*r, z = cz + Math.cos(a)*r;
    if (rockAt(x, z) > 0.05) continue;
    const h = hS(x, z);
    if (h - hS(x + 3, z) > 1.6 && hS(x - 2, z) <= h + 0.05){
      // nudge to crest top
      let bx = x, bh = h;
      for (let k = 1; k <= 6; k++){ const hh = hS(x - k*0.5, z); if (hh > bh){ bh = hh; bx = x - k*0.5; } }
      emitters.push({ x: bx, z, acc: 0, ph: rnd()*10 });
    }
  }
  const riding = pl.state === 'ride';
  const g = wind*(riding ? 1.5 : 1);
  for (const e of emitters){
    const gust = 0.55 + 0.45*Math.sin(time*0.9 + e.ph) ;
    e.acc += dt*24*g*gust;
    while (e.acc >= 1){
      e.acc -= 1;
      const z = e.z + rr(-4, 4), x = e.x + rr(-0.6, 0.3);
      const y = hS(x, z) + rr(0.02, 0.35);
      spawnP(x, y, z, rr(3.5, 7.5)*g, rr(0.2, 1.4), rr(-0.4, 0.4), rr(1.2, 2.6), rr(0.08, 0.2), 8 + (rnd()*2|0), rr(0.3, 0.6), 0.25, 0.9);
    }
  }
  // saltation around the player
  const n = (riding ? 140 : 50)*dt*g;
  for (let i = 0; i < n; i++){
    const x = cx + rr(-22, 22), z = cz + rr(-22, 22);
    spawnP(x, hAt(x, z) + rr(0.03, 0.5), z, rr(5, 9)*g, rr(0, 0.4), rr(-0.3, 0.3), rr(0.4, 1.0), rr(0.04, 0.08), 8 + (rnd()*2|0), rr(0.25, 0.5), 0.1, 0.6);
  }
  // crests about to be crossed by the worm stream and tremble
  if (worm && worm.state === 'approach'){
    for (const c of worm.cross){
      const ds = c.s - worm.s;
      if (ds > 0 && ds < 95){
        const k = 1 - ds/95;
        const m = 70*k*dt;
        for (let i = 0; i < m; i++){
          const a = rnd()*6.283, r = rnd()*9;
          const x = c.x + Math.cos(a)*r, z = c.z + Math.sin(a)*r;
          spawnP(x, hS(x, z) + 0.1, z, rr(-1.5, 1.5) + wind*2, rr(0.5, 3 + 4*k), rr(-1.5, 1.5), rr(0.8, 1.8), rr(0.1, 0.35), 7 + (rnd()*3|0), 0.6, 0.5, 4);
        }
      }
    }
    // ground trembles near the player as the worm closes in
    const d = wormDist(pl.x, pl.z);
    const k = clamp(1 - d/120, 0, 1);
    for (let i = 0; i < 40*k*dt; i++){
      const x = pl.x + rr(-12, 12), z = pl.z + rr(-12, 12);
      spawnP(x, hAt(x, z) + 0.05, z, rr(-0.3, 0.3), rr(0.8, 2.2), rr(-0.3, 0.3), rr(0.3, 0.7), rr(0.05, 0.12), 6 + (rnd()*3|0), 0.8, 0.5, 8);
    }
  }
}

// ════════════════════════════════════════════════════════════════════
//  World rebasing (keeps coordinates small; the world tiles every T)
// ════════════════════════════════════════════════════════════════════
function rebase(){
  let sx = 0, sz = 0;
  if (Math.abs(pl.x) > T*0.75) sx = Math.round(pl.x/T)*T;
  if (Math.abs(pl.z) > T*0.75) sz = Math.round(pl.z/T)*T;
  if (!sx && !sz) return;
  pl.x -= sx; pl.z -= sz;
  if (pl.swx !== undefined){ pl.swx -= sx; pl.swz -= sz; }
  if (hook){ hook.sx -= sx; hook.sz -= sz; }
  blOx -= sx; blOz -= sz;
  cam.x -= sx; cam.z -= sz; cam.lx -= sx; cam.lz -= sz; cam.sx -= sx; cam.sz -= sz;
  if (th){ th.x -= sx; th.z -= sz; }
  if (worm){
    const w = worm;
    w.hx -= sx; w.hz -= sz;
    for (const p of w.trail){ p.x -= sx; p.z -= sz; }
    if (w.PX){ for (let i = 0; i < w.PX.length; i++){ w.PX[i] -= sx; w.PZ[i] -= sz; } }
    if (w.cross) for (const c of w.cross){ c.x -= sx; c.z -= sz; }
    if (w.tx !== undefined){ w.tx -= sx; w.tz -= sz; }
    wormSpheres();
  }
  for (let i = 0; i < P.n; i++){ P.x[i] -= sx; P.z[i] -= sz; }
  for (let i = 0; i < 48; i++){ fp[i*4] -= sx; fp[i*4+1] -= sz; }
  for (const e of emitters){ e.x -= sx; e.z -= sz; }
}

// ════════════════════════════════════════════════════════════════════
//  Camera
// ════════════════════════════════════════════════════════════════════
function camClear(tx, ty, tz, cx, cy, cz){
  let need = cy;
  for (let k = 1; k <= 8; k++){
    const f = k/8;
    const x = lerp(tx, cx, f), z = lerp(tz, cz, f), y = lerp(ty, cy, f);
    const hm = hAt(x, z) + 0.9;
    if (y < hm) need = Math.max(need, ty + (hm - ty)/f);
  }
  return need;
}
function updateCamera(dt, rdt){
  const riding = pl.state === 'ride' || (pl.state === 'hooking' && hook && hook.phase === 'climb');
  // auto-align behind the motion when the mouse is idle
  if (state === 'play' && rtime - cam.lastMouse > 1.6){
    let ty = null, rate = 0;
    if (riding && worm){ ty = worm.heading; rate = 1.6; }
    else { const hs = Math.hypot(pl.vx, pl.vz); if (hs > 1.2){ ty = Math.atan2(pl.vx, pl.vz); rate = 0.35*clamp(hs/4, 0, 1.4); } }
    if (ty !== null){
      const d = angWrap(ty - cam.yaw);
      if (riding || Math.abs(d) < 2.4) cam.yaw += d*damp(rate, rdt);
    }
    if (riding) cam.pitch = lerp(cam.pitch, -0.12, damp(1, rdt));
  }
  let swingOff = 0;
  if (cam.swing > 0){ cam.swing = Math.max(0, cam.swing - rdt/1.8); const e = cam.swing; swingOff = 1.25*e*e*(3 - 2*e); }
  const yaw = cam.yaw + swingOff;
  const pitch = cam.pitch + (riding ? 0.04 : 0);
  const hs = Math.hypot(pl.vx, pl.vz);
  const dist = riding ? 12.5 + swingOff*5 : 6.0 + clamp(hs/6.5, 0, 1)*1.0;
  const tx = pl.x + (riding && worm ? worm.dirx*2 : 0), ty = pl.y + (riding ? 1.5 : 1.35), tz = pl.z + (riding && worm ? worm.dirz*2 : 0);
  const cp = Math.cos(pitch), sp = Math.sin(pitch);
  let cx = tx - Math.sin(yaw)*cp*dist, cy = ty - sp*dist, cz = tz - Math.cos(yaw)*cp*dist;
  cy = camClear(tx, ty, tz, cx, cy, cz);
  if (riding && worm){
    // stay clear of the worm's back
    const S = worm.sph;
    for (let k = 3; k < 12; k++){ const d = Math.hypot(cx - S[k*4], cz - S[k*4+2]), R = S[k*4+3] + 1.2; if (d < R) cy = Math.max(cy, S[k*4+1] + Math.sqrt(R*R - d*d) + 0.8); }
  }
  // wide view
  let fx = pl.x, fy = pl.y, fz = pl.z;
  if (worm && worm.state !== 'dive'){ fx = lerp(pl.x, worm.hx, 0.45); fz = lerp(pl.z, worm.hz, 0.45); fy = lerp(pl.y, hS(worm.hx, worm.hz), 0.45); }
  else if (th){ fx = lerp(pl.x, th.x, 0.4); fz = lerp(pl.z, th.z, 0.4); }
  const wx = fx - Math.sin(cam.yaw)*150, wz = fz - Math.cos(cam.yaw)*150;
  let wy = Math.max(fy, hS(wx, wz)) + 105;
  cam.blend = clamp(cam.blend + (cam.mode ? rdt : -rdt)/1.0, 0, 1);
  const e = cam.blend*cam.blend*(3 - 2*cam.blend);
  let px = lerp(cx, wx, e), py = lerp(cy, wy, e), pz = lerp(cz, wz, e);
  let lx = lerp(tx, fx, e), ly = lerp(ty, fy, e), lz = lerp(tz, fz, e);
  // title orbit
  if (state === 'title' || titleBlend > 0){
    if (state === 'title') cam.orbit += rdt*0.09; else titleBlend = Math.max(0, titleBlend - rdt/1.8);
    const R = 7.6, ox = pl.x + Math.sin(cam.orbit)*R, oz = pl.z + Math.cos(cam.orbit)*R;
    let oy = pl.y + 2.0 + Math.sin(cam.orbit*0.7)*0.4;
    oy = camClear(pl.x, pl.y + 1.2, pl.z, ox, oy, oz);
    const tb = state === 'title' ? 1 : titleBlend*titleBlend*(3 - 2*titleBlend);
    if (state === 'title'){ cam.yaw = Math.atan2(pl.x - ox, pl.z - oz); }
    px = lerp(px, ox, tb); py = lerp(py, oy, tb); pz = lerp(pz, oz, tb);
    lx = lerp(lx, pl.x, tb); ly = lerp(ly, pl.y + 1.25, tb); lz = lerp(lz, pl.z, tb);
  }
  if (!cam.init){ cam.sx = px; cam.sy = py; cam.sz = pz; cam.init = true; }
  const k = damp(riding ? 10 : 14, rdt);
  cam.sx += (px - cam.sx)*k; cam.sy += (py - cam.sy)*k; cam.sz += (pz - cam.sz)*k;
  // never inside the dunes
  cam.sy = Math.max(cam.sy, hAt(cam.sx, cam.sz) + 0.7);
  // shake
  let prox = 0;
  if (worm && worm.state !== 'dive') prox = clamp(1 - wormDist(pl.x, pl.z)/230, 0, 1);
  if (pl.state === 'ride') prox = 0.22;
  cam.shake = Math.max(0, cam.shake - rdt*1.2);
  const sh = (cam.shake*cam.shake*0.5 + prox*prox*0.32)*(state === 'play' ? 1 : 0);
  const t = rtime*31;
  const jx = (Math.sin(t*1.13) + Math.sin(t*2.71))*0.5*sh, jy = (Math.sin(t*1.7 + 1) + Math.sin(t*3.1))*0.5*sh, jz = Math.sin(t*1.37 + 2)*sh;
  cam.x = cam.sx + jx; cam.y = cam.sy + jy; cam.z = cam.sz + jz;
  cam.lx = lx + jx*0.6; cam.ly = ly + jy*0.6; cam.lz = lz + jz*0.6;
  const wantFov = (riding ? 74 : 62) - e*6 + swingOff*8;
  cam.fov = lerp(cam.fov, wantFov, damp(3, rdt));
}

// ════════════════════════════════════════════════════════════════════
//  Update
// ════════════════════════════════════════════════════════════════════
function update(rdt){
  rtime += rdt;
  if (slowmo > 0){ slowmo -= rdt; timeScale = lerp(timeScale, 0.3, damp(12, rdt)); }
  else timeScale = lerp(timeScale, 1, damp(3, rdt));
  const dt = rdt*timeScale;
  time += dt;
  wind = 0.75 + 0.25*Math.sin(time*0.13 + windSeed) + 0.15*Math.sin(time*0.47 + windSeed*2);
  if (state === 'loading') return;
  updateThumper(dt);
  updateWorm(dt);
  computeBulge();
  findHookTarget();
  updatePlayer(dt);
  decayFurrow();
  updateEmitters(dt);
  updateParticles(dt);
  rebase();
  updateCamera(dt, rdt);
  if (msg){ msg.t += rdt; if (msg.t > msg.dur) msg = null; }
  auUpdate();
}

// ════════════════════════════════════════════════════════════════════
//  Render
// ════════════════════════════════════════════════════════════════════
const uPl = new Float32Array(16), uTh = new Float32Array(8);
const emptyW = new Float32Array(WN*4);
function norm3(v){ const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0]/l, v[1]/l, v[2]/l]; }
function cross3(a, b){ return [a[1]*b[2] - a[2]*b[1], a[2]*b[0] - a[0]*b[2], a[0]*b[1] - a[1]*b[0]]; }
function moonDir(off, el){
  const az = Math.atan2(-SUNH[0], -SUNH[1]) + off;
  return [Math.sin(az)*Math.cos(el), Math.sin(el), Math.cos(az)*Math.cos(el)];
}
function render(){
  if (!texH) return;
  const F = norm3([cam.lx - cam.x, cam.ly - cam.y, cam.lz - cam.z]);
  const R = norm3(cross3(F, [0, 1, 0]));
  const U = cross3(R, F);
  const tanH = Math.tan(cam.fov*Math.PI/360);
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
  gl.viewport(0, 0, rw, rh);
  gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.ALWAYS); gl.depthMask(true);
  gl.useProgram(progScene);
  const u = progScene.u;
  gl.uniform2f(u.uRes, rw, rh);
  gl.uniform3f(u.uCP, cam.x, cam.y, cam.z);
  gl.uniform3fv(u.uCF, F); gl.uniform3fv(u.uCR, R); gl.uniform3fv(u.uCU, U);
  gl.uniform1f(u.uTanH, tanH); gl.uniform1f(u.uAsp, rw/rh); gl.uniform1f(u.uPix, 2*tanH/rh);
  gl.uniform1f(u.uTime, time); gl.uniform1f(u.uWind, wind*(pl.state === 'ride' ? 1.5 : 1)); gl.uniform1f(u.uTop, maxH + 6);
  gl.uniform3fv(u.uSun, SUN);
  gl.uniform3fv(u.uM1, moonDir(0.45, Math.min(0.5, 0.17 + time*0.0004)));
  gl.uniform3fv(u.uM2, moonDir(-0.32, Math.min(0.62, 0.33 + time*0.0003)));
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, texH); gl.uniform1i(u.uH, 0);
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, texN); gl.uniform1i(u.uN, 1);
  gl.activeTexture(gl.TEXTURE2); gl.bindTexture(gl.TEXTURE_2D, texD); gl.uniform1i(u.uD, 2);
  gl.activeTexture(gl.TEXTURE5); gl.bindTexture(gl.TEXTURE_2D, texB); gl.uniform1i(u.uB, 5);
  gl.uniform3f(u.uBO, blOx, blOz, blOn ? 1 : 0);
  if (worm && worm.rN > 0){
    gl.uniform4fv(u.uW, worm.rsph); gl.uniform1i(u.uWN, WN);
    gl.uniform4f(u.uWB, worm.bx, worm.by, worm.bz, worm.br); gl.uniform1f(u.uMouth, worm.mouth);
  } else { gl.uniform4fv(u.uW, emptyW); gl.uniform1i(u.uWN, 0); gl.uniform4f(u.uWB, 0, -1e4, 0, 1); gl.uniform1f(u.uMouth, 0); }
  // player
  let wx = wind*0.55, wz = 0;
  wx -= pl.vx*0.05; wz -= pl.vz*0.05;
  const cy = Math.cos(pl.yaw), sy = Math.sin(pl.yaw);
  const lwx = wx*cy - wz*sy, lwz = wx*sy + wz*cy;
  const wl = Math.hypot(lwx, lwz), wcap = pl.state === 'ride' ? 0.75 : 0.5;
  const ws = wl > wcap ? wcap/wl : 1;
  uPl.set([pl.x, pl.y, pl.z, pl.yaw, pl.phase, pl.stride, pl.lean, pl.crouch, lwx*ws, lwz*ws, pl.flap*(pl.state === 'ride' ? 1.6 : 1), pl.roll, pl.arms, pl.plant, pl.drag, pl.state === 'swallowed' ? 0 : 1]);
  gl.uniform4fv(u.uPl, uPl);
  if (th){
    uTh.set([th.x, th.y, th.z, (1 - ss(0, 1, th.drive))*1.2 + (th.gone ? 99 : 0), th.lift, th.light, 1, 0]);
  } else uTh.fill(0);
  gl.uniform4fv(u.uTh, uTh);
  gl.uniform4fv(u.uFP, fp);
  gl.bindVertexArray(vaoEmpty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  // particles
  if (P.n > 0){
    let o = 0;
    for (let i = 0; i < P.n; i++){
      const lf = P.life[i]/P.max[i];
      pBuf[o++] = P.x[i]; pBuf[o++] = P.y[i]; pBuf[o++] = P.z[i]; pBuf[o++] = P.size[i];
      pBuf[o++] = P.col[i]; pBuf[o++] = P.a[i]*Math.min(1, lf*2.5)*Math.min(1, (1 - lf)*12 + 0.3);
    }
    gl.bindBuffer(gl.ARRAY_BUFFER, pVBO);
    gl.bufferSubData(gl.ARRAY_BUFFER, 0, pBuf, 0, o);
    gl.depthFunc(gl.LESS); gl.depthMask(false);
    gl.useProgram(progPart);
    const pu = progPart.u;
    const proj = perspective(cam.fov*Math.PI/180, rw/rh, 0.1, FAR);
    const view = lookAt([cam.x, cam.y, cam.z], [cam.lx, cam.ly, cam.lz]);
    gl.uniformMatrix4fv(pu.uVP, false, mul4(proj, view));
    gl.uniform3f(pu.uCP, cam.x, cam.y, cam.z);
    gl.uniform1f(pu.uPxK, rh/(2*tanH));
    gl.uniform1i(pu.uN, 1); gl.uniform1i(pu.uH, 0);
    gl.bindVertexArray(pVAO);
    gl.drawArrays(gl.POINTS, 0, P.n);
    gl.depthMask(true);
  }
  gl.disable(gl.DEPTH_TEST);
  // post
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  gl.viewport(0, 0, rw, rh);
  gl.useProgram(progPost);
  gl.activeTexture(gl.TEXTURE3); gl.bindTexture(gl.TEXTURE_2D, fbC); gl.uniform1i(progPost.u.uC, 3);
  gl.activeTexture(gl.TEXTURE4); gl.bindTexture(gl.TEXTURE_2D, fbZ); gl.uniform1i(progPost.u.uZ, 4);
  gl.uniform2f(progPost.u.uRes, rw, rh); gl.uniform1f(progPost.u.uTime, rtime);
  gl.bindVertexArray(vaoEmpty);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  gl.activeTexture(gl.TEXTURE0);
}
function perspective(fovy, asp, n, f){
  const t = 1/Math.tan(fovy/2);
  return [t/asp,0,0,0, 0,t,0,0, 0,0,(f+n)/(n-f),-1, 0,0,2*f*n/(n-f),0];
}
function lookAt(e, c){
  const z = norm3([e[0]-c[0], e[1]-c[1], e[2]-c[2]]);
  const x = norm3(cross3([0,1,0], z));
  const y = cross3(z, x);
  return [x[0],y[0],z[0],0, x[1],y[1],z[1],0, x[2],y[2],z[2],0,
    -(x[0]*e[0]+x[1]*e[1]+x[2]*e[2]), -(y[0]*e[0]+y[1]*e[1]+y[2]*e[2]), -(z[0]*e[0]+z[1]*e[1]+z[2]*e[2]), 1];
}
function mul4(a, b){
  const o = new Float32Array(16);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++){
    let s = 0; for (let k = 0; k < 4; k++) s += a[k*4 + r]*b[c*4 + k]; o[c*4 + r] = s;
  }
  return o;
}

// ════════════════════════════════════════════════════════════════════
//  Interface (Canvas 2D)
// ════════════════════════════════════════════════════════════════════
const C_CREAM = '#fbeed0', C_SAND = '#f0b968', C_ORANGE = '#e3964a', C_DARK = '#1b1945', C_INK = '#140c18';
function txt(s, x, y, size, color, font, align, alpha, shadow){
  const c = uctx;
  c.globalAlpha = alpha === undefined ? 1 : alpha;
  c.font = size + 'px ' + font;
  c.textAlign = align || 'left'; c.textBaseline = 'middle';
  if (shadow !== false){ c.fillStyle = C_INK; const o = Math.max(1, Math.round(size/12)); c.fillText(s, x + o, y + o); }
  c.fillStyle = color; c.fillText(s, x, y);
  c.globalAlpha = 1;
}
const PIX = "'Silkscreen', monospace", MONO = "'IBM Plex Mono', monospace";
function drawUI(){
  const c = uctx, W = ui.width, H = ui.height;
  c.clearRect(0, 0, W, H);
  c.imageSmoothingEnabled = false;
  const u = Math.max(1, Math.round(Math.min(H/360, W/560)));
  if (state === 'loading'){
    c.fillStyle = '#1b1430'; c.fillRect(0, 0, W, H);
    for (let i = 0; i < 6; i++){ c.fillStyle = PAL.SKY[9 - i]; c.fillRect(0, H*0.62 + i*H*0.015, W, H*0.015); }
    c.fillStyle = PAL.SAND[2]; c.fillRect(0, H*0.71, W, H);
    txt('SANDCALLER', W/2, H*0.36, 24*u, C_CREAM, PIX, 'center');
    const bw = Math.min(W*0.5, 260*u), bh = 4*u, bx = (W - bw)/2, by = H*0.5;
    c.fillStyle = C_INK; c.fillRect(bx - u, by - u, bw + 2*u, bh + 2*u);
    c.fillStyle = PAL.SAND[3]; c.fillRect(bx, by, bw, bh);
    c.fillStyle = C_ORANGE; c.fillRect(bx, by, Math.floor(bw*loadProg/u)*u, bh);
    txt('les dunes se forment… ' + Math.floor(loadProg*100) + ' %', W/2, by + 16*u, 9*u, C_SAND, MONO, 'center', 0.85);
    return;
  }
  const playA = state === 'play' ? clamp(1 - titleBlend*1.4, 0, 1) : 0;
  // sound toggle (top right)
  const sl = (AU.on ? '♪ son : activé' : '♪ son : coupé') + (isTouch ? '' : '  [M]');
  c.font = (9*u) + 'px ' + MONO;
  const sw = c.measureText(sl).width;
  const sx = W - sw - 14*u, sy = 14*u;
  uiRects.sound = [sx - 6*u, sy - 8*u, sw + 12*u, 16*u];
  txt(sl, sx, sy, 9*u, AU.on ? C_SAND : C_CREAM, MONO, 'left', AU.on ? 0.9 : 0.6);
  if (state === 'title' || titleBlend > 0){
    const a = state === 'title' ? 1 : titleBlend;
    txt('SANDCALLER', W/2, H*0.2, 26*u, C_CREAM, PIX, 'center', a);
    txt('appeler le géant des sables', W/2, H*0.2 + 22*u, 9*u, C_SAND, MONO, 'center', a*0.85);
    const blink = (Math.sin(rtime*3) > -0.3) ? 1 : 0.25;
    const pr = isTouch ? 'touchez l’écran pour commencer' : 'appuyez sur une touche pour commencer';
    txt(pr, W/2, H*0.86, 9*u, C_CREAM, MONO, 'center', a*0.8*blink);
  }
  if (playA > 0){
    // thumper indicator (top left)
    const ix = 16*u, iy = 14*u;
    const act = th && th.active;
    const pulse = act ? (th.beat > 0.88 || th.beat < 0.12 ? 1 : 0.55) : 0.35;
    c.globalAlpha = playA*(act ? 0.95 : 0.5);
    c.fillStyle = C_INK; c.fillRect(ix - u, iy - 7*u, 4*u, 15*u);
    c.fillStyle = act ? C_SAND : '#a27896'; c.fillRect(ix, iy - 6*u, 2*u, 13*u);
    c.fillStyle = act ? C_ORANGE : '#6f5f93'; c.fillRect(ix - u, iy - 3*u + (act ? Math.round(th.lift*3)*u : 0), 4*u, 3*u);
    c.globalAlpha = 1;
    txt('marteleur', ix + 9*u, iy - 2*u, 9*u, C_CREAM, MONO, 'left', playA*0.75);
    txt(act ? 'actif' : (th && th.stopped ? 'silencieux' : 'au repos'), ix + 9*u, iy + 8*u, 8*u, act ? C_ORANGE : C_CREAM, MONO, 'left', playA*(act ? pulse : 0.45));
    // hints strip
    let hint;
    if (pl.state === 'ride' || pl.state === 'hooking') hint = isTouch ? 'joystick : diriger · SAUT : sauter du ver · VUE : changer de vue'
      : 'Q D / A D : diriger  ·  Z W : accélérer  ·  ESPACE : sauter du ver  ·  TAB : vue';
    else hint = isTouch ? 'joystick : marcher (loin : courir) · E : marteleur / crochets · SAUT · VUE · glisser : regarder'
      : 'ZQSD / WASD : marcher  ·  MAJ : courir  ·  E : marteleur / crochets  ·  ESPACE : sauter  ·  TAB : vue  ·  souris : regarder';
    let hs = 8*u;
    c.font = hs + 'px ' + MONO;
    const hw = c.measureText(hint).width;
    if (hw > W*0.94) hs = Math.max(6, Math.floor(hs*W*0.94/hw));
    txt(hint, W/2, isTouch ? 40*u : H - 14*u, hs, C_CREAM, MONO, 'center', playA*0.55);
    // mount prompt
    if (hookTarget >= 0){
      const py = H*0.62, pulse = 0.75 + 0.25*Math.sin(rtime*8);
      txt(isTouch ? 'E  ·  lancer les crochets' : '[E]  lancer les crochets', W/2, py, 11*u, C_CREAM, PIX, 'center', 0.95*pulse);
    }
    if (msg){
      const a = clamp(Math.min(msg.t/0.4, (msg.dur - msg.t)/0.8), 0, 1);
      txt(msg.text, W/2, H*0.74, 9*u, C_CREAM, MONO, 'center', a*0.85);
    }
    if (isTouch) drawTouch(u, playA);
  }
}
function drawTouch(u, a){
  const c = uctx, W = ui.width, H = ui.height;
  const jx = touch.jid !== null ? touch.jx : 90*u, jy = touch.jid !== null ? touch.jy : H - 80*u;
  c.globalAlpha = 0.35*a;
  c.strokeStyle = C_CREAM; c.lineWidth = 2*u;
  c.beginPath(); c.arc(jx, jy, 46*u, 0, 6.283); c.stroke();
  c.fillStyle = C_CREAM; c.beginPath(); c.arc(jx + touch.kx*40*u, jy + touch.ky*40*u, 16*u, 0, 6.283); c.fill();
  c.globalAlpha = 1;
  const btns = [['act', 'E', W - 70*u, H - 120*u], ['jump', 'SAUT', W - 140*u, H - 60*u], ['view', 'VUE', W - 60*u, H - 46*u]];
  if (hookTarget >= 0) btns[0][1] = 'E !';
  for (const [k, l, x, y] of btns){
    const r = 26*u;
    uiRects[k] = [x - r, y - r, 2*r, 2*r];
    c.globalAlpha = (keys[k] ? 0.6 : 0.32)*a;
    c.fillStyle = k === 'act' && hookTarget >= 0 ? C_ORANGE : C_INK; c.beginPath(); c.arc(x, y, r, 0, 6.283); c.fill();
    c.strokeStyle = C_CREAM; c.lineWidth = 2*u; c.stroke();
    c.globalAlpha = 1;
    txt(l, x, y, 9*u, C_CREAM, PIX, 'center', 0.85*a);
  }
}

// ════════════════════════════════════════════════════════════════════
//  Generation driver
// ════════════════════════════════════════════════════════════════════
function generate(){
  return new Promise((resolve, reject) => {
    const W = clamp(navigator.hardwareConcurrency || 4, 2, 6);
    heights = new Float32Array(N*N); rockMask = new Uint8Array(N*N);
    nrmRGBA = new Uint8Array(N*N*4);
    let workers = [];
    let url = null;
    try { url = URL.createObjectURL(new Blob([WSRC], { type: 'text/javascript' })); for (let i = 0; i < W; i++) workers.push(new Worker(url)); }
    catch (e) { console.warn('workers unavailable, generating on main thread', e); workers = []; }
    let fallback = null;
    const getFallback = () => fallback || (fallback = new Function(WSRC + '\nreturn handle;')());
    const prog = new Float32Array(W*2);
    const updProg = () => { let s = 0; for (let i = 0; i < W; i++) s += prog[i]*0.72 + prog[W + i]*0.23; loadProg = s/W; };
    const band = N/W;
    let doneH = 0, doneP = 0;
    const runJob = (i, msg, onDone) => {
      const onMsg = d => {
        if (d.type === 'prog'){ prog[(msg.cmd === 'post' ? W : 0) + i] = d.f; updProg(); }
        else onDone(d);
      };
      if (workers.length){
        const wk = workers[i];
        wk.onmessage = e => onMsg(e.data);
        wk.onerror = err => { console.warn('worker error, falling back', err); err.preventDefault && err.preventDefault(); setTimeout(() => getFallback()(msg, onMsg), 0); };
        wk.postMessage(msg);
      } else setTimeout(() => getFallback()(msg, onMsg), 10 + i*5);
    };
    const phase2 = () => {
      for (let i = 0; i < W; i++){
        const y0 = Math.round(i*band), y1 = Math.round((i + 1)*band);
        const copy = workers.length ? heights.slice() : heights;
        runJob(i, { cmd: 'post', h: copy, y0, y1, k: i, W, tanE: Math.tan(SUN_EL) }, d => {
          const o = d.y0*N;
          for (let q = 0; q < (d.y1 - d.y0)*N; q++){ nrmRGBA[(o + q)*4] = d.nrm[q*2]; nrmRGBA[(o + q)*4 + 1] = d.nrm[q*2 + 1]; }
          const sh = d.sh;
          for (let q = 0; q < N*N; q++) if (sh[q]) nrmRGBA[q*4 + 2] = sh[q];
          prog[W + i] = 1; updProg();
          if (++doneP === W){
            for (let q = 0; q < N*N; q++) nrmRGBA[q*4 + 3] = rockMask[q];
            workers.forEach(w => w.terminate()); if (url) URL.revokeObjectURL(url);
            resolve();
          }
        });
      }
    };
    for (let i = 0; i < W; i++){
      const y0 = Math.round(i*band), y1 = Math.round((i + 1)*band);
      runJob(i, { cmd: 'height', seed: SEED, y0, y1 }, d => {
        heights.set(d.h, d.y0*N); rockMask.set(d.r, d.y0*N);
        prog[i] = 1; updProg();
        if (++doneH === W) phase2();
      });
    }
  });
}

// ════════════════════════════════════════════════════════════════════
//  Main loop
// ════════════════════════════════════════════════════════════════════
let lastT = performance.now(), ftAvg = 16, ftT = 0, lastDrop = -100, upgradeT = 0;
function frame(now){
  const rdt = Math.min(0.05, Math.max(0.001, (now - lastT)/1000));
  lastT = now;
  frameNo++;
  if (state !== 'loading'){
    update(rdt);
    render();
    adaptRes(rdt);
  } else {
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.clearColor(0.105, 0.078, 0.188, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  }
  drawUI();
  if (!TEST || !window.__SC_manual) requestAnimationFrame(frame);
}
function adaptRes(rdt){
  if (TEST || QS.has('fixedres')) return;
  ftAvg = lerp(ftAvg, rdt*1000, 0.05);
  ftT += rdt;
  if (ftT < 2) return;
  if (ftAvg > 24 && rh > 170){ resDrop++; resize(); ftT = 0; ftAvg = 16; lastDrop = rtime; }
  else if (ftAvg < 14.5 && resDrop > 0 && rtime - lastDrop > 25){ resDrop--; resize(); ftT = 0; ftAvg = 16; }
}

async function boot(){
  requestAnimationFrame(frame);
  const t0 = performance.now();
  await generate();
  loadProg = 1;
  uploadTerrain();
  initWorld();
  if (TEST) console.log('generated in', Math.round(performance.now() - t0), 'ms');
  state = 'title';
  updateCamera(0.016, 0.016);
}
boot();

// ════════════════════════════════════════════════════════════════════
//  Test hooks (only with ?test)
// ════════════════════════════════════════════════════════════════════
if (TEST){
  window.__SC = {
    get ready(){ return state !== 'loading'; },
    get state(){ return state; }, set state(v){ state = v; },
    pl, cam, keys, touch,
    get th(){ return th; }, get worm(){ return worm; }, get hookTarget(){ return hookTarget; },
    get time(){ return time; }, get P(){ return P.n; },
    start(){ startGame(); titleBlend = 0; },
    press(a){ onPress(a); },
    step(dt, n){ for (let i = 0; i < (n || 1); i++){ frameNo++; update(dt); } },
    render(){ render(); drawUI(); },
    hAt, hS, rockAt,
    forceWorm(){ if (th){ th.wormAt = th.t + 0.01; } },
    setMode(m){ cam.mode = m; cam.blend = m; },
    spawnJet,
    glErr(){ return gl.getError(); },
    finite(){
      const v = [pl.x, pl.y, pl.z, pl.vx, pl.vz, cam.x, cam.y, cam.z, cam.lx, cam.ly, cam.lz, cam.yaw];
      if (worm){ v.push(worm.hx, worm.hy, worm.hz); for (let i = 0; i < worm.sph.length; i++) v.push(worm.sph[i]); }
      for (let i = 0; i < P.n; i++){ v.push(P.x[i], P.y[i]); }
      return v.every(Number.isFinite);
    },
    thumperMode,
    get pr(){ return { rw, rh, pixScale }; },
  };
}
})();
